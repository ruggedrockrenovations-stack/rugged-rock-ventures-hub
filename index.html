          <input id="pFitScore" type="number" min="0" max="100" value="${property && property.fitScore!==undefined && property.fitScore!=='' ? property.fitScore : ''}" placeholder="0–100">
        </div>
      </div>
      <div class="field">
        <label>${t('field_photo_url')}</label>
        <input id="pPhotoUrl" type="url" value="${property ? escapeAttr(property.photoUrl||'') : ''}" placeholder="https://…">
      </div>
      <div class="field">
        <label>${t('field_listing_url')}</label>
        <input id="pListingUrl" type="url" value="${property ? escapeAttr(property.listingUrl||'') : ''}" placeholder="https://…">
      </div>
      <div class="field">
        <label>${t('field_auction_datetime')}</label>
        <div class="field-row" style="margin-top:0;">
          <input id="pAuctionDate" type="date" value="${property && property.auctionDate ? property.auctionDate : ''}" style="flex:1.3;">
          <input id="pAuctionTime" type="time" value="${property && property.auctionTime ? property.auctionTime : ''}" style="flex:1;">
        </div>
      </div>
      <div class="field">
        <label>${t('field_drive_url')}</label>
        <input id="pDriveUrl" type="url" value="${property ? escapeAttr(property.driveUrl||'') : ''}" placeholder="https://drive.google.com/drive/folders/...">
      </div>
      <div class="field">
        <label>${t('field_notes')}</label>
        <div class="notelog" id="noteLogList"></div>
        <div class="note-add-row">
          <textarea id="pNewNote" placeholder="${t('add_note_ph')}"></textarea>
          <button type="button" class="mic-btn" id="pMicBtn">🎤</button>
          <button type="button" class="cleanup-btn" id="pCleanupBtn" title="${t('cleanup_title')}">${t('cleanup_btn')}</button>
          <button type="button" id="addNoteBtn">${t('add_btn')}</button>
        </div>
      </div>
      <div class="modal-actions">
        ${isEdit ? `<button class="btn-danger" id="delBtn">${t('delete')}</button>` : ''}
        <button class="btn-secondary" id="cancelBtn">${t('cancel')}</button>
        <button class="btn-primary" id="saveBtn">${t('save')}</button>
      </div>
    </div>
  </div>`;

  document.getElementById('closeM').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };

  // ---- note log (local working copy) ----
  let noteLog = property && Array.isArray(property.noteLog) ? [...property.noteLog] : [];
  function renderNoteLog(){
    const el = document.getElementById('noteLogList');
    if(noteLog.length===0){
      el.innerHTML = `<div class="note-empty">${t('no_notes')}</div>`;
      return;
    }
    const sorted = [...noteLog].reverse();
    el.innerHTML = sorted.map(n=>`<div class="note-entry"><div class="note-date">${fmtDate(n.date)}</div><div class="note-text">${escapeHtml(n.text)}</div></div>`).join('');
  }
  renderNoteLog();
  document.getElementById('addNoteBtn').onclick = ()=>{
    const ta = document.getElementById('pNewNote');
    const text = ta.value.trim();
    if(!text) return;
    noteLog.push({id:uid(), text, date:todayISO()});
    ta.value='';
    renderNoteLog();
  };
  attachVoiceButton('pNewNote', 'pMicBtn', {autoCleanup:true, cleanupBtnId:'pCleanupBtn'});
  document.getElementById('pCleanupBtn').onclick = ()=>cleanupNoteText('pNewNote', 'pCleanupBtn');

  // ---- quick-fill from pasted listing text ----
  const qfBtn = document.getElementById('qfBtn');
  if(qfBtn){
    qfBtn.onclick = ()=>{
      const raw = document.getElementById('qfPaste').value;
      if(!raw.trim()){ showAlert(t('quickfill_need_text')); return; }
      let foundBits = [];
      // price: first $ amount found
      const priceMatch = raw.match(/\$\s?[\d,]+(?:\.\d{2})?/);
      if(priceMatch) document.getElementById('pPrice').value = priceMatch[0].replace(/\s+/,'');
      // address: line containing a street-number pattern
      const lines = raw.split(/\n|\r/).map(l=>l.trim()).filter(Boolean);
      const addrLine = lines.find(l=>/^\d{2,6}\s+\S+/.test(l));
      if(addrLine) document.getElementById('pAddress').value = addrLine;
      // county: look for "County" keyword
      const countyMatch = raw.match(/([A-Z][a-zA-Z]+)\s+County/);
      if(countyMatch) document.getElementById('pCounty').value = countyMatch[1] + ' County';
      // source: guess from domain-ish keywords in the text
      const lower = raw.toLowerCase();
      const sourceSelect = document.getElementById('pSource');
      if(lower.includes('auction.com')) sourceSelect.value = 'Auction.com';
      else if(lower.includes('xome')) sourceSelect.value = 'Xome';
      else if(lower.includes('hubzu')) sourceSelect.value = 'Hubzu';
      // auction/sale time: e.g. "10:00 AM", "2 PM", "at 9:30am"
      const timeMatch = raw.match(/(\d{1,2})(?::(\d{2}))?\s?(am|pm|AM|PM)\b/);
      if(timeMatch){
        let hr = parseInt(timeMatch[1],10);
        const min = timeMatch[2] ? timeMatch[2] : '00';
        const mer = timeMatch[3].toLowerCase();
        if(mer==='pm' && hr!==12) hr += 12;
        if(mer==='am' && hr===12) hr = 0;
        document.getElementById('pAuctionTime').value = String(hr).padStart(2,'0') + ':' + min;
        foundBits.push('Sale time: ' + timeMatch[0].trim());
      }
      // square footage: number followed by sq ft / sqft / square feet
      const sqftMatch = raw.match(/([\d,]{3,6})\s*(?:sq\.?\s?ft\.?|sqft|square\s?feet)/i);
      if(sqftMatch){ document.getElementById('pSqft').value = sqftMatch[1]; foundBits.push('Sq ft: ' + sqftMatch[1]); }
      // beds / baths, since they're usually right next to sqft on listing pages
      const bedsMatch = raw.match(/(\d+(?:\.\d+)?)\s*(?:bed|beds|bd|bedrooms?)\b/i);
      if(bedsMatch){ document.getElementById('pBeds').value = bedsMatch[1]; foundBits.push('Beds: ' + bedsMatch[1]); }
      const bathsMatch = raw.match(/(\d+(?:\.\d+)?)\s*(?:bath|baths|ba|bathrooms?)\b/i);
      if(bathsMatch){ document.getElementById('pBaths').value = bathsMatch[1]; foundBits.push('Baths: ' + bathsMatch[1]); }
      // lot size: acres or sq ft lot
      const lotAcreMatch = raw.match(/([\d.]+)\s*acres?\b/i);
      const lotSqftMatch = raw.match(/lot\s*(?:size)?\s*[:\-]?\s*([\d,]{3,7})\s*(?:sq\.?\s?ft\.?|sqft)/i);
      if(lotAcreMatch){ document.getElementById('pLotSize').value = lotAcreMatch[1] + ' acres'; foundBits.push('Lot size: ' + lotAcreMatch[1] + ' acres'); }
      else if(lotSqftMatch){ document.getElementById('pLotSize').value = lotSqftMatch[1] + ' sq ft'; foundBits.push('Lot size: ' + lotSqftMatch[1] + ' sq ft'); }
      // year built
      const yearMatch = raw.match(/built\s*(?:in)?\s*[:\-]?\s*(19|20)\d{2}/i);
      if(yearMatch) foundBits.push('Year built: ' + yearMatch[0].match(/(19|20)\d{2}/)[0]);

      if(foundBits.length){
        noteLog.push({id:uid(), text:'From listing — ' + foundBits.join(' · '), date:todayISO()});
        renderNoteLog();
      }
      showAlert(t('quickfill_success'));
    };
  }

  const delBtn = document.getElementById('delBtn');
  if(delBtn){
    delBtn.onclick = ()=>{
      showConfirm(t('delete_property_confirm'), async ()=>{
        await removePropertyAuction(property.id);
        properties = properties.filter(p=>p.id!==property.id);
        await saveProperties();
        closeModal();
        render();
      });
    };
  }

  document.getElementById('saveBtn').onclick = async ()=>{
    const address = document.getElementById('pAddress').value.trim();
    if(!address){ showAlert(t('address_required')); return; }
    const entry = {
      id: property ? property.id : uid(),
      address,
      county: document.getElementById('pCounty').value.trim(),
      source: document.getElementById('pSource').value,
      price: document.getElementById('pPrice').value.trim(),
      status: document.getElementById('pStatus').value,
      beds: document.getElementById('pBeds').value.trim(),
      baths: document.getElementById('pBaths').value.trim(),
      sqft: document.getElementById('pSqft').value.trim(),
      lotSize: document.getElementById('pLotSize').value.trim(),
      propertyType: document.getElementById('pPropType').value,
      dealType: document.getElementById('pDealType').value,
      fitScore: document.getElementById('pFitScore').value.trim()==='' ? '' : Math.max(0, Math.min(100, Number(document.getElementById('pFitScore').value))),
      photoUrl: document.getElementById('pPhotoUrl').value.trim() || null,
      listingUrl: document.getElementById('pListingUrl').value.trim() || null,
      auctionDate: document.getElementById('pAuctionDate').value || null,
      auctionTime: document.getElementById('pAuctionTime').value || null,
      driveUrl: document.getElementById('pDriveUrl').value.trim() || null,
      noteLog: noteLog,
      createdAt: property ? property.createdAt : Date.now()
    };
    if(property){
      const idx = properties.findIndex(p=>p.id===property.id);
      properties[idx] = entry;
    }else{
      properties.push(entry);
    }
    await saveProperties();
    await syncPropertyAuction(entry);
    closeModal();
    render();
  };
}

// ---------------- daily to-do ----------------
function renderDailyToDo(content){
  const dateObj = new Date(dtdSelectedDate + 'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString(currentLang==='es' ? 'es-ES' : 'en-US', {weekday:'long', month:'short', day:'numeric'});

  let html = `<div class="display" style="font-size:24px;">${t('tab_dailytodo')}</div>
  <div style="font-size:13.5px;color:#8a8175;margin-bottom:18px;max-width:520px;">${t('dailytodo_desc')}</div>`;
  html += `<div class="cal-header">
    <div class="cal-nav">
      <button id="dtdPrevDay">&#8249;</button>
      <div class="cal-month display" style="font-size:22px; min-width:220px; text-transform:capitalize;">${dateLabel}</div>
      <button id="dtdNextDay">&#8250;</button>
    </div>
    <button class="btn-secondary" id="dtdTodayBtn" style="padding:8px 14px;font-size:12.5px;">${t('dtd_today')}</button>
  </div>`;

  html += '<div class="prop-grid" style="margin-top:16px;">';
  CREW_DEFAULTS.forEach(name=>{
    const tasks = dailyTasks.filter(tk=>tk.dateISO===dtdSelectedDate && tk.crewName===name);
    const doneCount = tasks.filter(tk=>tk.done).length;
    const badge = tasks.length===0 ? t('dtd_no_tasks_badge') : t('dtd_tasks_count').replace('{done}', doneCount).replace('{total}', tasks.length);
    html += `<div class="prop-card editable" data-name="${name}">
      <div class="prop-address">${name}</div>
      <div class="prop-meta">${badge}</div>
    </div>`;
  });
  html += '</div>';

  content.innerHTML = html;

  document.getElementById('dtdPrevDay').onclick = ()=>{
    const d = new Date(dtdSelectedDate + 'T00:00:00');
    d.setDate(d.getDate()-1);
    dtdSelectedDate = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    render();
  };
  document.getElementById('dtdNextDay').onclick = ()=>{
    const d = new Date(dtdSelectedDate + 'T00:00:00');
    d.setDate(d.getDate()+1);
    dtdSelectedDate = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    render();
  };
  document.getElementById('dtdTodayBtn').onclick = ()=>{
    dtdSelectedDate = todayISO();
    render();
  };

  content.querySelectorAll('.prop-card[data-name]').forEach(c=>{
    c.onclick = ()=>openCrewDayModal(c.dataset.name);
  });
}

function renderCrewTaskList(){
  const listEl = document.getElementById('dtdTaskList');
  if(!listEl) return;
  const tasks = dailyTasks.filter(tk=>tk.dateISO===dtdSelectedDate && tk.crewName===listEl.dataset.crew);
  if(tasks.length===0){
    listEl.innerHTML = `<div class="note-empty">${editMode ? t('dtd_no_tasks_edit') : t('dtd_no_tasks_view')}</div>`;
    return;
  }
  listEl.innerHTML = tasks.map(tk=>`
    <div class="note-entry-row" style="padding:6px 0;" data-id="${tk.id}">
      <button type="button" class="note-checkbox ${tk.done?'checked':''}" data-id="${tk.id}">✓</button>
      <div class="note-entry-body">
        <div class="note-text" style="${tk.done?'text-decoration:line-through;color:#a89e91;':''}">${escapeHtml(tk.text)}</div>
      </div>
      ${editMode ? `<button type="button" class="modal-close" style="position:static;width:auto;height:auto;font-size:16px;" data-del="${tk.id}">&times;</button>` : ''}
    </div>
  `).join('');

  listEl.querySelectorAll('.note-checkbox').forEach(cb=>{
    cb.onclick = async ()=>{
      const id = cb.dataset.id;
      const task = dailyTasks.find(tk=>tk.id===id);
      if(!task) return;
      const wasDone = task.done;
      task.done = !task.done;
      await saveDailyTasks();
      renderCrewTaskList();
      renderDailyTodoCardsInBackground();
      if(!wasDone && task.done){
        showUndoToast(t('dtd_task_completed'), async ()=>{
          task.done = false;
          await saveDailyTasks();
          renderCrewTaskList();
          renderDailyTodoCardsInBackground();
        });
      }
    };
  });

  if(editMode){
    listEl.querySelectorAll('button[data-del]').forEach(b=>{
      b.onclick = ()=>{
        showConfirm(t('delete_entry_confirm'), async ()=>{
          dailyTasks = dailyTasks.filter(tk=>tk.id!==b.dataset.del);
          await saveDailyTasks();
          renderCrewTaskList();
          renderDailyTodoCardsInBackground();
        });
      };
    });
  }
}

function renderDailyTodoCardsInBackground(){
  // refresh the crew summary cards behind the modal without closing it
  if(activeTab==='dailytodo'){
    const dateObj = new Date(dtdSelectedDate + 'T00:00:00');
    const cards = document.querySelectorAll('#content .prop-card[data-name]');
    cards.forEach(c=>{
      const name = c.dataset.name;
      const tasks = dailyTasks.filter(tk=>tk.dateISO===dtdSelectedDate && tk.crewName===name);
      const doneCount = tasks.filter(tk=>tk.done).length;
      const badge = tasks.length===0 ? t('dtd_no_tasks_badge') : t('dtd_tasks_count').replace('{done}', doneCount).replace('{total}', tasks.length);
      const metaEl = c.querySelector('.prop-meta');
      if(metaEl) metaEl.textContent = badge;
    });
  }
}

function openCrewDayModal(crewName){
  const root = document.getElementById('modalRoot');
  const dateObj = new Date(dtdSelectedDate + 'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString(currentLang==='es' ? 'es-ES' : 'en-US', {weekday:'long', month:'short', day:'numeric'});

  root.innerHTML = `<div class="overlay" id="ov">
    <div class="modal modal-wrap">
      <button class="modal-close" id="closeM">&times;</button>
      <h3>${escapeHtml(crewName)}</h3>
      <div style="font-size:12.5px;color:#8a8175;margin-bottom:14px;text-transform:capitalize;">${dateLabel}</div>
      <div class="notelog" id="dtdTaskList" data-crew="${escapeAttr(crewName)}" style="max-height:none;margin-bottom:${editMode?'16px':'0'};"></div>
      ${editMode ? `
      <div class="note-add-row" style="align-items:flex-start;margin-bottom:10px;">
        <textarea id="dtdNewTasks" placeholder="${t('dtd_add_placeholder')}" style="min-height:70px;"></textarea>
        <button type="button" class="mic-btn" id="dtdMicBtn">🎤</button>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="dtdClearBtn">${t('dtd_clear_completed')}</button>
        <button class="btn-primary" id="dtdSplitBtn" style="flex:1;">${t('dtd_add_as_tasks')}</button>
      </div>` : ''}
    </div>
  </div>`;

  document.getElementById('closeM').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };

  renderCrewTaskList();

  if(editMode){
    attachVoiceButton('dtdNewTasks', 'dtdMicBtn');

    document.getElementById('dtdSplitBtn').onclick = async ()=>{
      const ta = document.getElementById('dtdNewTasks');
      const raw = ta.value.trim();
      if(!raw) return;
      const splitBtn = document.getElementById('dtdSplitBtn');
      splitBtn.disabled = true;
      const originalText = splitBtn.textContent;
      splitBtn.textContent = t('dtd_splitting');

      let items = await splitIntoTasks(raw);
      if(!items || items.length===0){
        // fallback: naive split on newlines
        items = raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      }
      if(items.length===0){
        showAlert(t('dtd_split_error'));
      }else{
        items.forEach(text=>{
          dailyTasks.push({
            id: uid(),
            dateISO: dtdSelectedDate,
            crewName: crewName,
            text,
            done: false,
            createdAt: Date.now()
          });
        });
        await saveDailyTasks();
        ta.value = '';
        renderCrewTaskList();
        renderDailyTodoCardsInBackground();
      }
      splitBtn.disabled = false;
      splitBtn.textContent = originalText;
    };

    document.getElementById('dtdClearBtn').onclick = ()=>{
      showConfirm(t('dtd_clear_confirm'), async ()=>{
        dailyTasks = dailyTasks.filter(tk=>!(tk.dateISO===dtdSelectedDate && tk.crewName===crewName && tk.done));
        await saveDailyTasks();
        renderCrewTaskList();
        renderDailyTodoCardsInBackground();
      });
    };
  }
}

// ---------------- open notes ----------------
function renderOpenNotes(content){
  // build the list of currently "active" jobs to link notes to
  const activeJobOptions = [];
  properties.filter(p=>p.status==='Active').forEach(p=>{
    activeJobOptions.push({id:p.id, label:p.address});
  });
  activeJobs.forEach(j=>{
    activeJobOptions.push({id:j.id, label:j.title});
  });

  let html = `<div class="cal-header" style="margin-bottom:6px;">
    <div class="display" style="font-size:24px;">${t('tab_opennotes')}</div>
  </div>
  <div style="font-size:13.5px;color:#8a8175;margin-bottom:18px;max-width:520px;">${t('opennotes_desc')}</div>`;

  html += `<div class="field" style="max-width:340px;">
      <label>${t('opennotes_link_job')}</label>
      <select id="onJobSelect">
        <option value="">${t('opennotes_no_job')}</option>
        ${activeJobOptions.map(j=>`<option value="${j.id}">${escapeHtml(j.label)}</option>`).join('')}
      </select>
    </div>
    <div class="note-add-row" style="margin-bottom:10px;align-items:flex-start;">
      <textarea id="onNewNote" placeholder="${t('opennotes_placeholder')}" style="min-height:80px;"></textarea>
      <button type="button" class="mic-btn" id="onMicBtn">🎤</button>
      <button type="button" class="cleanup-btn" id="onCleanupBtn" title="${t('cleanup_title')}">${t('cleanup_btn')}</button>
      <button type="button" id="onAddBtn">${t('add_btn')}</button>
    </div>`;

  if(activeJobOptions.length > 0 || openNotes.some(n=>n.jobId)){
    html += `<div style="margin-bottom:18px;">
      <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#8a8175;margin-bottom:8px;">${t('opennotes_filter_label')}</label>
      <div class="filter-row" style="margin-bottom:0;">
        <button type="button" class="filter-chip onFilterChip ${openNotesFilter===''?'active':''}" data-val="">${t('opennotes_filter_all')}</button>
        <button type="button" class="filter-chip onFilterChip ${openNotesFilter==='__none__'?'active':''}" data-val="__none__">${t('opennotes_filter_general')}</button>
        ${activeJobOptions.map(j=>`<button type="button" class="filter-chip onFilterChip ${openNotesFilter===j.id?'active':''}" data-val="${j.id}">${escapeHtml(j.label)}</button>`).join('')}
      </div>
    </div>`;
  }

  const filtered = openNotes.filter(n=>{
    if(!openNotesFilter) return true;
    if(openNotesFilter==='__none__') return !n.jobId;
    return n.jobId===openNotesFilter;
  });
  const sorted = [...filtered].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  if(sorted.length===0){
    html += `<div class="empty-state"><div class="display">${t('opennotes_empty_title')}</div><div>${t('opennotes_empty_edit')}</div></div>`;
  }else{
    html += '<div class="notelog" style="max-height:none;">';
    sorted.forEach(n=>{
      const meta = [n.author, fmtDate(n.createdDateISO)].filter(Boolean).join(' ' + t('by_label') + ' ');
      html += `<div class="note-entry" data-id="${n.id}">
        <div class="note-entry-row">
          <div class="note-entry-body">
            ${n.jobLabel ? `<span class="status-badge status-active" style="margin-bottom:5px;">${escapeHtml(n.jobLabel)}</span>` : ''}
            <div class="note-date">${meta}</div>
            <div class="note-text">${escapeHtml(n.text)}</div>
          </div>
          <button type="button" class="note-checkbox" data-id="${n.id}">✓</button>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  content.innerHTML = html;

  content.querySelectorAll('.onFilterChip').forEach(b=>{
    b.onclick = ()=>{ openNotesFilter = b.dataset.val; render(); };
  });

  document.getElementById('onAddBtn').onclick = async ()=>{
    const ta = document.getElementById('onNewNote');
    const text = ta.value.trim();
    if(!text) return;
    const jobSelect = document.getElementById('onJobSelect');
    const jobId = jobSelect.value || null;
    const jobLabel = jobId ? (activeJobOptions.find(j=>j.id===jobId) || {}).label || null : null;
    openNotes.push({
      id: uid(),
      text,
      author: notifPrefs.myName || '',
      createdAt: Date.now(),
      createdDateISO: todayISO(),
      jobId,
      jobLabel
    });
    await saveOpenNotes();
    render();
  };
  attachVoiceButton('onNewNote', 'onMicBtn', {autoCleanup:true, cleanupBtnId:'onCleanupBtn'});
  document.getElementById('onCleanupBtn').onclick = ()=>cleanupNoteText('onNewNote', 'onCleanupBtn');

  content.querySelectorAll('.note-checkbox').forEach(cb=>{
    cb.onclick = async ()=>{
      const id = cb.dataset.id;
      cb.classList.add('checked');
      const entryEl = content.querySelector(`.note-entry[data-id="${id}"]`);
      if(entryEl) entryEl.classList.add('completing');
      setTimeout(async ()=>{
        const removed = openNotes.find(n=>n.id===id);
        openNotes = openNotes.filter(n=>n.id!==id);
        await saveOpenNotes();
        if(removed){
          showUndoToast(t('note_completed'), async ()=>{
            openNotes.push(removed);
            await saveOpenNotes();
            render();
          });
        }
        render();
      }, 320);
    };
  });
}

    html += `<button class="btn-secondary" id="importVcfBtn" style="padding:8px 14px;font-size:12.5px;">${t('import_contacts_btn')}</button>`;
    html += `<input type="file" id="importVcfInput" accept=".vcf,text/vcard" style="display:none;">`;
    const hasContactPicker = 'contacts' in navigator && 'ContactsManager' in window;
    if(hasContactPicker){
      html += `<button class="btn-secondary" id="pickPhoneBtn" style="padding:8px 14px;font-size:12.5px;">${t('pick_from_phone_btn')}</button>`;
    }
    html += `<button class="add-btn" id="addContactBtn">${t('add_contact_btn')}</button>`;
  }
  html += '</div>';

  const q = contactsSearch.toLowerCase();
  const list = contacts.filter(c=>{
    if(!q) return true;
    return (c.name||'').toLowerCase().includes(q) || (c.company||'').toLowerCase().includes(q) || (c.role||'').toLowerCase().includes(q);
  }).sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  if(list.length===0){
    html += `<div class="empty-state"><div class="display">${t('no_contacts_title')}</div><div>${editMode ? t('no_contacts_edit') : t('no_contacts_view')}</div></div>`;
  }else{
    html += '<div class="prop-grid">';
    list.forEach(c=>{
      html += `<div class="prop-card editable" data-id="${c.id}">
        <div class="prop-address">${escapeHtml(c.name||'')}</div>
        ${c.company || c.role ? `<div class="prop-meta">${escapeHtml(c.company||'')}${c.company&&c.role?' • ':''}${escapeHtml(c.role||'')}</div>` : ''}
        ${c.phone ? `<div class="prop-price" style="display:flex;align-items:center;gap:8px;">${escapeHtml(c.phone)}<button type="button" class="copy-btn" data-copy="${escapeAttr(c.phone)}">${t('copy_btn')}</button></div>` : ''}
        ${c.email ? `<div class="prop-meta">${escapeHtml(c.email)}</div>` : ''}
      </div>`;
    });
    html += '</div>';
  }

  content.innerHTML = html;

  document.getElementById('contactSearchBox').oninput = (e)=>{ contactsSearch = e.target.value; render(); };
  const exportAllBtn = document.getElementById('exportAllBtn');
  if(exportAllBtn) exportAllBtn.onclick = downloadAllVcf;
  const addBtn = document.getElementById('addContactBtn');
  if(addBtn) addBtn.onclick = ()=>openContactModal(null);

  const importBtn = document.getElementById('importVcfBtn');
  if(importBtn){
    importBtn.onclick = ()=>document.getElementById('importVcfInput').click();
    document.getElementById('importVcfInput').onchange = async (e)=>{
      const file = e.target.files[0];
      e.target.value = '';
      if(!file) return;
      const text = await file.text();
      const parsed = parseVcfText(text);
      if(parsed.length===0){ showAlert(t('import_no_contacts_found')); return; }
      showConfirm(t('import_confirm').replace('{n}', parsed.length), async ()=>{
        parsed.forEach(p=>{
          contacts.push({
            id: uid(), name: p.name, company: p.company, role: p.role,
            phone: p.phone, email: p.email, notes: p.notes, createdAt: Date.now()
          });
        });
        await saveContacts();
        showAlert(t('import_done'));
        render();
      });
    };
  }

  const pickBtn = document.getElementById('pickPhoneBtn');
  if(pickBtn){
    pickBtn.onclick = async ()=>{
      try{
        const selected = await navigator.contacts.select(['name','tel','email'], {multiple:true});
        if(!selected || selected.length===0) return;
        selected.forEach(c=>{
          contacts.push({
            id: uid(),
            name: (c.name && c.name[0]) || '',
            company: '', role: '',
            phone: (c.tel && c.tel[0]) || '',
            email: (c.email && c.email[0]) || '',
            notes: '',
            createdAt: Date.now()
          });
        });
        await saveContacts();
        showAlert(t('import_done'));
        render();
      }catch(err){
        // user cancelled the picker — no error needed
      }
    };
  }

  content.querySelectorAll('.prop-card[data-id]').forEach(c=>{
    c.onclick = (e)=>{
      if(e.target.closest('.copy-btn')) return; // let the copy button handle its own click
      const contact = contacts.find(x=>x.id===c.dataset.id);
      if(contact) openContactModal(contact);
    };
  });
  content.querySelectorAll('.copy-btn[data-copy]').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      copyToClipboard(b.dataset.copy, b);
    };
  });
}

        </div>
        <div class="field">
          <label>${t('field_role')}</label>
          <input id="cRole" value="${contact ? escapeAttr(contact.role||'') : ''}" placeholder="Electrician">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>${t('field_phone')}</label>
          <input id="cPhone" type="tel" value="${contact ? escapeAttr(contact.phone||'') : ''}" placeholder="(208) 555-0123">
        </div>
        <div class="field">
          <label>${t('field_email')}</label>

function renderHallOfFame(content){
  const canView = editMode || hofUnlocked;

  if(!canView){
    if(!settings.hofPassword){
      content.innerHTML = `<div class="hof-locked">
        <div class="display">${t('hof_title')}</div>
        <p>${t('hof_not_setup')}</p>
      </div>`;
      return;
    }
    content.innerHTML = `<div class="hof-locked">
      <div class="display">${t('hof_title')}</div>
      <p>${t('hof_locked_desc')}</p>
      <button class="add-btn" id="hofUnlockBtn">${t('enter_password_btn')}</button>
    </div>`;
    document.getElementById('hofUnlockBtn').onclick = hofUnlockPrompt;
    return;
  }

  let html = `<div class="display" style="font-size:24px;">${t('hof_title')}</div>
  <div style="font-size:13.5px;color:#8a8175;margin-bottom:18px;max-width:520px;">${t('hof_desc_main')}</div>`;
  html += `<div class="cal-header" style="margin-bottom:18px;">
    <div></div>
    <div style="display:flex;gap:8px;">
      ${editMode ? `<button class="btn-secondary" id="hofPwBtn" style="padding:8px 14px;font-size:12.5px;">${settings.hofPassword?t('change_viewing_password'):t('set_viewing_password')}</button>` : ''}
      ${editMode ? `<button class="add-btn" id="addFlipBtn">${t('add_flip_btn')}</button>` : ''}
    </div>
  </div>`;

  const sorted = [...flips].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  // year-by-year counter, based on sold date
  const yearCounts = {};
  let undated = 0;
  flips.forEach(f=>{
    if(f.soldDate){
      const yr = f.soldDate.slice(0,4);
      yearCounts[yr] = (yearCounts[yr]||0) + 1;
    }else{
      undated++;
    }
  });
  const years = Object.keys(yearCounts).sort((a,b)=>b-a);
  if(flips.length>0){
    const maxCount = Math.max(...Object.values(yearCounts), 1);
    html += `<div class="hof-summary">
      <div class="hof-summary-top">
        <div class="hof-total-count">${flips.length}</div>
        <div class="hof-total-label">${flips.length===1?t('flip_total'):t('flips_total')}</div>
      </div>
      ${years.length ? `<div class="year-bars">${years.map(yr=>{
        const c = yearCounts[yr];
        const pct = Math.round((c/maxCount)*100);
        return `<div class="year-bar-row"><div class="year-bar-label">${yr}</div><div class="year-bar-track"><div class="year-bar-fill" style="width:${pct}%;"></div></div><div class="year-bar-count">${c}</div></div>`;
      }).join('')}</div>` : ''}
      ${undated>0 ? `<div class="hof-summary-hint">${undated} ${t('profit_total')}${undated===1?'':'s'} ${t('undated_hint')}</div>` : ''}
    </div>`;
  }

  if(sorted.length===0){
    html += `<div class="empty-state"><div class="display">${t('no_flips_title')}</div><div>${editMode ? t('no_flips_edit') : t('no_flips_view')}</div></div>`;
  }else{
    html += '<div class="flip-grid">';
    sorted.forEach(f=>{
      const profit = (Number(f.sellPrice)||0) - (Number(f.purchasePrice)||0) - (Number(f.renoCost)||0);
      const hasProfit = f.sellPrice && (f.purchasePrice || f.renoCost);
      html += `<div class="flip-card" data-id="${f.id}">
        ${f.coverPhoto ? `<img class="flip-cover" src="${escapeAttr(f.coverPhoto)}" alt="${escapeAttr(f.address)}" onerror="this.outerHTML='<div class=&quot;flip-cover-placeholder&quot;>${t('no_photo')}</div>'">` : `<div class="flip-cover-placeholder">${t('no_photo')}</div>`}
        <div class="flip-card-body">
          <div class="flip-address">${escapeHtml(f.address||'(no address)')}</div>
          ${hasProfit ? `<div class="flip-profit ${profit<0?'negative':''}">${profit<0?'-':''}$${Math.abs(profit).toLocaleString()} ${t('stat_profit').toLowerCase()}</div>` : ''}
        </div>
      </div>`;
    });
    html += '</div>';
  }

  content.innerHTML = html;

  const pwBtn = document.getElementById('hofPwBtn');
  if(pwBtn){
    pwBtn.onclick = ()=>{
      showPasswordPrompt(t('set_hof_password_prompt'), async (pw)=>{
        settings.hofPassword = pw;
        await saveSettings();
        showAlert(t('viewing_password_updated'));
      });
    };
  }
  const addBtn = document.getElementById('addFlipBtn');
  if(addBtn) addBtn.onclick = ()=>openFlipModal(null);

  content.querySelectorAll('.flip-card').forEach(c=>{
    c.onclick = ()=>{
      const f = flips.find(x=>x.id===c.dataset.id);
      if(f) openFlipDetail(f);
    };
  });
}

function parsePhotoLines(text){
  return text.split(/\n|\r/).map(l=>l.trim()).filter(Boolean);
}

  const profit = (Number(flip.sellPrice)||0) - (Number(flip.purchasePrice)||0) - (Number(flip.renoCost)||0);

// ---------------- Add to Home Screen ----------------
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  refreshA2HSBanner();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  const banner = document.getElementById('a2hsBanner');
  if(banner) banner.style.display = 'none';
});

function isStandaloneDisplay(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function isIOSDevice(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

function refreshA2HSBanner(){
  const banner = document.getElementById('a2hsBanner');
  if(!banner || a2hsDismissed) return;
  if(isStandaloneDisplay()){ banner.style.display = 'none'; return; }

  const textEl = document.getElementById('a2hsText');
  const actionBtn = document.getElementById('a2hsActionBtn');

  if(deferredInstallPrompt){
    textEl.textContent = t('a2hs_banner_text');
    actionBtn.textContent = t('a2hs_install_btn');
    actionBtn.onclick = async ()=>{
      banner.style.display = 'none';
      deferredInstallPrompt.prompt();
      try{ await deferredInstallPrompt.userChoice; }catch(e){}
      deferredInstallPrompt = null;
    };
    banner.style.display = 'flex';
  }else if(isIOSDevice()){
    textEl.textContent = t('a2hs_banner_text');
    actionBtn.textContent = t('a2hs_howto_btn');
    actionBtn.onclick = ()=> showAlert(t('a2hs_ios_instructions'));
    banner.style.display = 'flex';
  }else{
    banner.style.display = 'none';
  }
}

let a2hsDismissed = false;

function copyToClipboard(text, btnEl){
  const showCopied = ()=>{
    if(btnEl){
      const original = btnEl.textContent;
      btnEl.textContent = '✓';
      btnEl.disabled = true;
      setTimeout(()=>{ btnEl.textContent = original; btnEl.disabled = false; }, 1200);
    }
  };
  const fallbackCopy = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok) showCopied();
      else showAlert(t('copy_failed'));
    }catch(e){
      showAlert(t('copy_failed'));
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
  }else{
    fallbackCopy();
  }
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
