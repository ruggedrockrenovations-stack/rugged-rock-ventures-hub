<style>
  :root{
    --charcoal:#2B2420;
    --ink:#1E1A16;
    --rust:#8A5A3B;
    --rust-dark:#6E4630;
    --paper:#EDE8DF;
    --card:#FBF9F5;
    --line: rgba(43,36,32,0.14);
    --line-soft: rgba(43,36,32,0.08);
    --slate:#5B6570;
    --amber:#B8863B;
    --moss:#3F6B4A;
    --brick:#9C4438;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    letter-spacing:0.01em;
    text-transform:uppercase;
    color:var(--charcoal);
  }
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  /* ---------- header ---------- */
  .topbar{
    background:var(--charcoal);
    color:var(--white);
    position:sticky;
    top:0;
    z-index:50;
  }
  .topbar-inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 20px;
  }
  .logo-img{height:42px;width:42px;flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;line-height:1;}
  .brand-text .name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:0.03em;text-transform:uppercase;}
  .brand-text .sub{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:0.12em;color:#C9BEB2;text-transform:uppercase;margin-top:2px;}
  .topbar-spacer{flex:1;}
  .edit-toggle{
    border:1px solid rgba(255,255,255,0.25);
    background:transparent;
    color:var(--white);
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .15s;
  }
  .edit-toggle:hover{background:rgba(255,255,255,0.1);}
  .edit-toggle.active{background:var(--rust);border-color:var(--rust);}
  .dot{width:7px;height:7px;border-radius:50%;background:#8a8580;}
  .edit-toggle.active .dot{background:#D9C79A;}
  .lang-toggle{display:flex;border:1px solid rgba(255,255,255,0.25);border-radius:6px;overflow:hidden;}
  .lang-btn{
    background:transparent;
    color:#C9BEB2;
    border:none;
    padding:8px 11px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  .lang-btn.active{background:var(--rust);color:var(--white);}
  .lang-btn:hover:not(.active){background:rgba(255,255,255,0.08);}

  /* roofline accent strip */
  .roofline{
    height:10px;
    width:100%;
    background:var(--rust);
    clip-path:polygon(0% 100%, 0% 40%, 6% 0%, 12% 40%, 18% 0%, 24% 40%, 30% 0%, 36% 40%, 42% 0%, 48% 40%, 54% 0%, 60% 40%, 66% 0%, 72% 40%, 78% 0%, 84% 40%, 90% 0%, 96% 40%, 100% 0%, 100% 100%);
  }

  /* ---------- tabs ---------- */
  .a2hs-banner{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .a2hs-banner span{font-size:13px;color:var(--ink);font-weight:500;}
  .a2hs-btn{
    background:var(--rust);
    color:var(--white);
    border:none;
    padding:7px 14px;
    border-radius:16px;
    font-weight:700;
    font-size:12.5px;
    white-space:nowrap;
  }
  .a2hs-btn:hover{background:var(--rust-dark);}
  .a2hs-dismiss{
    background:transparent;
    border:none;
    color:#a89e91;
    font-size:18px;
    width:24px;height:24px;
    flex-shrink:0;
  }
  .tabbar{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    gap:4px;
    padding:18px 20px 0 20px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    padding:8px 4px 12px 4px;
    margin-right:22px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:#8a8175;
    transition:color .15s, border-color .15s;
    white-space:nowrap;
    flex-shrink:0;
  }
  .tab-label-short{display:none;}
  .tab.active{color:var(--charcoal);border-bottom-color:var(--rust);}
  .tab:hover{color:var(--charcoal);}

  .content{max-width:1100px;margin:0 auto;padding:20px;}

  /* ---------- banner ---------- */
  .banner{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--rust);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:20px;
  }
  .banner-title{font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--rust-dark);margin-bottom:8px;}
  .banner-empty{font-size:14px;color:#7a7166;}
  .banner-item{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:14px;
    padding:4px 0;
  }
  .banner-item .when{font-weight:700;color:var(--brick);min-width:70px;}
  .banner-item .what{color:var(--ink);}

  /* ---------- calendar ---------- */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .cal-nav{display:flex;align-items:center;gap:14px;}
  .cal-nav button{background:var(--card);border:1px solid var(--line);width:34px;height:34px;border-radius:6px;font-size:16px;color:var(--charcoal);}
  .cal-nav button:hover{background:var(--paper);}
  .cal-jump{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 8px;
    font-size:14px;
    font-weight:700;
    color:var(--charcoal);
    font-family:'Barlow Condensed',sans-serif;
  }
  .cal-month{font-size:26px;min-width:190px;text-align:center;}
  .add-btn{
    background:var(--rust);
    color:var(--white);
    border:none;
    padding:10px 16px;
    border-radius:6px;
    font-weight:600;
    font-size:13px;
    display:flex;align-items:center;gap:6px;
  }
  .add-btn:hover{background:var(--rust-dark);}

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:6px;
  }
  .cal-dow{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#8a8175;text-align:center;padding-bottom:4px;}
  .cal-cell{
    background:var(--card);
    border:1px solid var(--line-soft);
    border-radius:8px;
    min-height:108px;
    min-width:0;
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .cal-cell.empty{background:transparent;border:none;}
  .cal-cell.today{border-color:var(--rust);border-width:2px;}
  .cal-daynum{font-size:12px;font-weight:600;color:#7a7166;margin-bottom:2px;}
  .cal-cell.today .cal-daynum{color:var(--rust-dark);}
  .chip{
    font-size:11px;
    padding:3px 6px;
    border-radius:4px;
    color:var(--white);
    font-weight:600;
    line-height:1.3;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    text-align:left;
    border:none;
    width:100%;
    min-width:0;
    max-width:100%;
  }
  .chip.job{background:var(--charcoal);}
  .chip.auction{background:var(--brick);}
  .chip.gcal{background:#4a6b8a;}
  .chip:hover{opacity:0.85;}
  .cal-add-day{
    font-size:11px;
    color:#b0a89c;
    background:transparent;
    border:none;
    text-align:left;
    padding:2px 4px;
  }
  .cal-add-day:hover{color:var(--rust);}
  .cal-search-row{display:flex;gap:8px;margin-bottom:6px;}
  .cal-search{flex:1;min-width:0;padding:10px 14px;border-radius:10px;border:1px solid var(--line-soft);font-size:14px;background:var(--card);color:var(--ink);}
  .cal-search-clear{padding:0 16px;border-radius:10px;border:1px solid var(--line-soft);background:var(--card);font-size:18px;color:#8a8175;}
  .cal-search-info{font-size:12.5px;color:#8a8175;margin-bottom:10px;min-height:18px;}
  .chip-match{outline:3px solid var(--amber);outline-offset:1px;}
  .cal-cell.match-day{border-color:var(--amber);border-width:2px;background:#fdf6ec;}
  .cal-zoom-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line-soft);background:var(--card);font-size:13px;font-weight:700;color:#5b5348;}
  @media (max-width:640px){
    .cal-grid.zoomed-out{grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible;}
    .cal-grid.zoomed-out .cal-cell{min-height:60px;padding:4px;}

  /* ---------- properties ---------- */
  .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center;}

    background:var(--card);

    border-radius:20px;
    font-size:13px;
    font-weight:600;
    color:#6b6257;
  }

  .filter-search{
    margin-left:auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:7px 13px;
    font-size:13px;
    min-width:160px;
  }
  .prop-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));

  .drive-link-btn{display:inline-block;margin-top:4px;padding:8px 14px;border-radius:8px;background:#e8eefc;color:#1a56db;font-size:13px;font-weight:700;text-decoration:none;width:fit-content;}

  .prop-address{font-size:17px;font-weight:700;color:var(--charcoal);line-height:1.25;}
  .prop-meta{font-size:12.5px;color:#8a8175;}
  .status-badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:12px;
    color:var(--white);
    width:fit-content;
    margin-top:2px;
  }
  .status-watching{background:var(--slate);}
  .status-bid{background:var(--amber);}
  .status-won{background:var(--moss);}
  .status-active{background:var(--rust);}
  .status-passed{background:#a89e91;}
  .status-flip{background:var(--brick);}
  .status-reno{background:var(--slate);}

  .active-section{margin-bottom:24px;}
  .active-section-title{
    font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--rust-dark);margin-bottom:10px;
  }
  .active-empty{
    background:var(--card);border:1px dashed var(--line);border-radius:8px;
    padding:16px;font-size:13.5px;color:#8a8175;
  }
  .section-divider{
    border:none;border-top:1px solid var(--line);margin:26px 0 18px 0;
  }
  .all-props-title{
    font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    color:#8a8175;margin-bottom:10px;
  }
  .prop-price{font-size:14px;font-weight:600;color:var(--ink);}
  .prop-auction{
    font-size:12.5px;
    font-weight:600;
    color:var(--brick);
    margin-top:2px;
  }
  .prop-notes{font-size:12.5px;color:#7a7166;margin-top:4px;line-height:1.4;}
  /* Zillow-style listing cards */
  .prop-card.listing{padding:0;overflow:hidden;}
  .prop-photo{
    position:relative;width:100%;aspect-ratio:16/10;background:#e9e2d8;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .prop-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .prop-photo .no-photo{font-size:12px;color:#a89e91;font-weight:600;}
  .prop-fit{
    position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;letter-spacing:.03em;
    padding:4px 10px;border-radius:12px;color:#fff;background:#a89e91;
  }

  .prop-fit.mid{background:#c08a3c;}
  .prop-new{
    position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;letter-spacing:.05em;
    padding:4px 10px;border-radius:12px;color:var(--rust-dark);background:#fff;
    box-shadow:0 1px 4px rgba(43,36,32,.18);text-transform:uppercase;
  }
  .prop-card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;}
  .prop-price-big{font-size:21px;font-weight:800;color:var(--charcoal);line-height:1.1;}
  .prop-specs{font-size:13px;font-weight:600;color:var(--ink);}
  .prop-card.listing .prop-address{font-size:14px;}
  .prop-badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .listing-link-btn{display:inline-block;margin-top:4px;padding:8px 14px;border-radius:8px;background:#eef2f7;color:#33475f;font-size:13px;font-weight:700;text-decoration:none;width:fit-content;border:1px solid var(--line);}
  .directions-btn{display:inline-block;margin-top:4px;padding:8px 14px;border-radius:8px;background:#e9f5ec;color:#1e7a3c;font-size:13px;font-weight:700;text-decoration:none;width:fit-content;}
  .finished-btn{display:inline-block;margin-top:4px;padding:8px 14px;border-radius:8px;background:#2f9e63;color:#fff;font-size:13px;font-weight:700;border:none;width:fit-content;cursor:pointer;}
  .switch-row{display:flex;align-items:center;gap:10px;background:#f2f8f4;border:1px solid #d9e9dd;border-radius:10px;padding:11px 13px;cursor:pointer;}
  .switch-row input{width:20px;height:20px;accent-color:#2f9e63;flex-shrink:0;}
  .switch-row span{font-size:14px;font-weight:700;color:#2c5f43;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:#8a8175;
  }
  .empty-state .display{font-size:22px;margin-bottom:6px;color:#7a716c;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;

    z-index:100;
    padding:20px;
  }

    padding:20px;
  }

    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#8a8175;

  .field input, .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);

    color:var(--ink);
    background:var(--white);

  .field-row{display:flex;gap:10px;}

  .crew-tag{
    border:1px solid var(--line);

    padding:6px 12px;
    border-radius:16px;
    font-size:13px;
    font-weight:600;
    color:#6b6257;
  }
  .crew-tag.picked{background:var(--charcoal);color:var(--white);border-color:var(--charcoal);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-primary{
    flex:1;
    background:var(--rust);
    color:var(--white);
    border:none;
    padding:11px;
    border-radius:6px;
    font-weight:700;
    font-size:14px;
  }
  .btn-primary:hover{background:var(--rust-dark);}
  .btn-secondary{
    background:var(--white);
    border:1px solid var(--line);
    color:var(--ink);
    padding:11px 16px;
    border-radius:6px;
    font-weight:600;
    font-size:14px;
  }
  .btn-secondary:hover{background:var(--paper);}
  .btn-danger{
    background:transparent;
    border:1px solid var(--brick);
    color:var(--brick);
    padding:11px 16px;
    border-radius:6px;
    font-weight:600;
    font-size:14px;
  }
  .btn-danger:hover{background:#fbeceb;}
  .modal-close{
    position:absolute;
    top:16px;right:16px;
    background:transparent;border:none;
    font-size:20px;color:#a89e91;
    width:28px;height:28px;
  }
  .modal-wrap{position:relative;}
  .detail-row{font-size:14px;margin-bottom:8px;color:var(--ink);}
  .detail-row strong{color:var(--charcoal);}

  .notelog{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;margin-bottom:10px;}
  .note-entry{
    background:var(--paper);
    border-radius:6px;
    padding:8px 10px;
  }
  .note-entry-row{display:flex;align-items:flex-start;gap:10px;}
  .note-entry-body{flex:1;min-width:0;}
  .note-checkbox{
    flex-shrink:0;
    width:24px;height:24px;
    border-radius:50%;
    border:2px solid #c9beb1;
    background:transparent;
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    color:transparent;
    transition:all .15s;
  }
  .note-checkbox:hover{border-color:var(--moss);}
  .note-checkbox.checked{
    background:var(--moss);
    border-color:var(--moss);
    color:var(--white);
  }
  .note-entry.completing{
    opacity:0.35;
    text-decoration:line-through;
    transition:opacity .35s;
  }
  .note-date{font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#a08e7d;margin-bottom:3px;}
  .note-text{font-size:13px;color:var(--ink);line-height:1.4;white-space:pre-wrap;}
  .note-empty{font-size:13px;color:#a89e91;padding:6px 2px;}
  .note-add-row{display:flex;gap:8px;margin-bottom:16px;}
  .note-add-row textarea{flex:1;min-height:38px;}
  .note-add-row button{
    background:var(--charcoal);color:var(--white);border:none;
    padding:0 14px;border-radius:6px;font-weight:600;font-size:13px;
  }
  .note-add-row button:hover{background:#3d342c;}
  .note-add-row button.mic-btn{
    background:var(--white);
    color:var(--charcoal);
    border:1px solid var(--line);
    padding:0;
    width:42px;
    flex-shrink:0;
    font-size:17px;
  }
  .note-add-row button.mic-btn:hover{background:var(--paper);}
  .note-add-row button.mic-btn.listening{
    background:var(--brick);
    color:var(--white);
    border-color:var(--brick);
    animation:micPulse 1s infinite;
  }
  .note-add-row button.cleanup-btn{
    background:var(--white);
    color:var(--charcoal);
    border:1px solid var(--line);

  .note-add-row button.cleanup-btn:hover{background:var(--paper);}
  .note-add-row button.cleanup-btn:disabled{opacity:0.5;}
  @keyframes micPulse{0%{opacity:1;}50%{opacity:0.55;}100%{opacity:1;}}

  /* ---------- chat assistant ---------- */
  .chat-fab{
    position:fixed;
    bottom:20px;right:20px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--rust);
    color:var(--white);
    border:none;

  }

  .undo-toast{
    position:fixed;

    border-radius:24px;
    padding:11px 10px 11px 18px;
    display:flex;

    .undo-toast{bottom:16px; max-width:calc(100vw - 32px);}
  }
  .chat-hint{
    position:fixed;
    bottom:86px;right:20px;
    z-index:150;
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:14px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 4px 14px rgba(43,36,32,0.2);
    cursor:pointer;
    animation:chatHintFloat 2.6s ease-in-out infinite;
  }
  .chat-hint::after{
    content:'';
    position:absolute;
    bottom:-7px;
    right:22px;
    width:14px;height:14px;
    background:var(--white);
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    transform:rotate(45deg);
  }
  .chat-hint-close{
    position:absolute;
    top:-9px;right:-9px;
    width:22px;height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--white);
    color:#8a8175;
    font-size:14px;line-height:1;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(43,36,32,0.18);
    padding:0;
  }
  .chat-hint-close:hover{color:var(--ink);}
  @keyframes chatHintFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }
  @media (max-width:640px){
    .chat-hint{bottom:82px; right:16px;}
  }
  .chat-panel{
    position:fixed;
    bottom:20px;right:20px;

    height:520px;
    max-height:calc(100vh - 40px);

    font-size:17px;
    text-transform:uppercase;

    if(!shared){
      const raw = localStorage.getItem('rrv_local_' + key);
      if(raw === null) throw new Error('not found: ' + key);
      return { key, value: raw, shared: false };
    }
    const { data, error } = await sbClient.from('kv_store').select('value').eq('key', key).maybeSingle();

  async set(key, value, shared){
    if(!shared){
      localStorage.setItem('rrv_local_' + key, value);
      return { key, value, shared: false };
    }
    const { error } = await sbClient.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) throw error;
    return { key, value, shared: true };
  }
};

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function fmtDateShort(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function fmtTime(hhmm){
  if(!hhmm) return '';
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  return d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
}

// ---------------- .ics export (real phone notifications via native calendar) ----------------
function buildIcs(job){
  const [y,m,d] = job.date.split('-');
  const startH = job.time ? job.time.split(':')[0] : '09';
  const startM = job.time ? job.time.split(':')[1] : '00';
  const dtStart = `${y}${m}${d}T${startH}${startM}00`;
  let dtEnd;
  if(job.endDate && job.endDate !== job.date){
    const [ey,em,ed] = job.endDate.split('-');
    dtEnd = `${ey}${em}${ed}T${startH}${startM}00`;
  }else{
    const endHour = String((parseInt(startH,10)+1)%24).padStart(2,'0');
    dtEnd = `${y}${m}${d}T${endHour}${startM}00`;
  }
  const uidStr = job.id + '@ruggedrockventures';
  const summary = (job.title||'Job').replace(/[\r\n]+/g,' ');
  const descParts = [];
  if(job.address) descParts.push('Address: '+job.address);
  if(job.notes) descParts.push('Notes: '+job.notes);
  const desc = descParts.join('\\n');
  let rrule = '';
  if(job.recurrence && job.recurrence!=='none'){
    let freq = 'WEEKLY', interval = 1;
    if(job.recurrence==='weekly'){ freq='WEEKLY'; interval=1; }
    else if(job.recurrence==='biweekly'){ freq='WEEKLY'; interval=2; }
    else if(job.recurrence==='monthly'){ freq='MONTHLY'; interval=1; }
    else if(job.recurrence==='yearly'){ freq='YEARLY'; interval=1; }
    let untilPart = '';
    if(job.recurrenceEndDate){
      const [uy,um,ud] = job.recurrenceEndDate.split('-');
      untilPart = ';UNTIL=' + `${uy}${um}${ud}T235959Z`;
    }
    rrule = `RRULE:FREQ=${freq};INTERVAL=${interval}${untilPart}`;
  }
  return [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rugged Rock Ventures//EN','BEGIN:VEVENT',
    'UID:'+uidStr, 'DTSTART:'+dtStart, 'DTEND:'+dtEnd, 'SUMMARY:'+summary,
    desc ? 'DESCRIPTION:'+desc : '',
    rrule || '',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Reminder','TRIGGER:-P1D','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');
}
function downloadIcs(job){
  const ics = buildIcs(job);
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (job.title||'event').replace(/[^a-z0-9]/gi,'_') + '.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------------- .vcf export (native phone Contacts app) ----------------
function buildVcf(contact){
  const lines = ['BEGIN:VCARD','VERSION:3.0', 'FN:'+(contact.name||'')];
  if(contact.company) lines.push('ORG:'+contact.company);
  if(contact.role) lines.push('TITLE:'+contact.role);
  if(contact.phone) lines.push('TEL;TYPE=CELL:'+contact.phone);
  if(contact.email) lines.push('EMAIL:'+contact.email);
  if(contact.notes) lines.push('NOTE:'+contact.notes.replace(/\r?\n/g,'\\n'));
  lines.push('END:VCARD');
  return lines.join('\r\n');
}
function downloadVcf(contact){
  const vcf = buildVcf(contact);
  const blob = new Blob([vcf], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (contact.name||'contact').replace(/[^a-z0-9]/gi,'_') + '.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function downloadAllVcf(){
  const combined = contacts.map(c=>buildVcf(c)).join('\r\n');
  const blob = new Blob([combined], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);

}

// ---------------- .vcf import (bulk upload from a phone's exported contacts) ----------------
function parseVcfText(text){
  const unfolded = text.replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '');
  const blocks = unfolded.match(/BEGIN:VCARD[\s\S]*?END:VCARD/gi) || [];
  const results = [];
  blocks.forEach(block=>{
    const lines = block.split(/\r\n|\n|\r/);
    let name='', company='', role='', phone='', email='', notes='';
    lines.forEach(line=>{
      const idx = line.indexOf(':');
      if(idx<0) return;
      const keyPart = line.slice(0, idx);
      const value = line.slice(idx+1).trim();
      const key = keyPart.split(';')[0].toUpperCase();
      if(key==='FN' && !name) name = value;
      else if(key==='N' && !name){
        const parts = value.split(';');
        name = [parts[1], parts[0]].filter(Boolean).join(' ').trim();
      }
      else if(key==='ORG' && !company) company = value.split(';')[0];
      else if(key==='TITLE' && !role) role = value;
      else if(key==='TEL' && !phone) phone = value;
      else if(key==='EMAIL' && !email) email = value;
      else if(key==='NOTE' && !notes) notes = value.replace(/\\n/g,'\n').replace(/\\,/g,',');
    });
    if(name || phone || email){
      results.push({name: name || '(no name)', company, role, phone, email, notes});
    }
  });
  return results;
}

// ---------------- voice-to-text for notes ----------------
function attachVoiceButton(textareaId, btnId, opts){
  opts = opts || {};
  const btn = document.getElementById(btnId);
  const ta = document.getElementById(textareaId);
  if(!btn || !ta) return;
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionAPI){
    btn.onclick = ()=> showAlert(t('voice_not_supported'));
    return;
  }
  let recognition = null;
  let listening = false;
  btn.onclick = ()=>{
    if(listening){
      recognition && recognition.stop();
      return;
    }
    recognition = new SpeechRecognitionAPI();
    recognition.lang = currentLang==='es' ? 'es-US' : 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = ()=>{
      listening = true;
      btn.classList.add('listening');
    };
    recognition.onresult = (e)=>{
      const transcript = e.results[0][0].transcript;
      const existing = ta.value.trim();
      ta.value = existing ? existing + ' ' + transcript : transcript;
      if(opts.autoCleanup && opts.cleanupBtnId){
        cleanupNoteText(textareaId, opts.cleanupBtnId);
      }
    };
    recognition.onerror = ()=>{
      showAlert(t('voice_error'));
    };
    recognition.onend = ()=>{
      listening = false;
      btn.classList.remove('listening');
    };
    recognition.start();
  };
}

async function cleanupNoteText(textareaId, btnId){
  const ta = document.getElementById(textareaId);
  const btn = document.getElementById(btnId);
  if(!ta) return;
  const raw = ta.value.trim();
  if(!raw) return;

  const originalBtnText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  ta.disabled = true;

  const langName = currentLang==='es' ? 'Spanish' : 'English';
  const systemPrompt = `You clean up rough, rambling spoken or typed field notes for a construction crew.
Turn the input into short, clear bullet points (one line each, starting with "- ") capturing every factual detail mentioned — condition, repairs needed, measurements, prices, names, anything concrete.
Remove filler words, false starts, and repetition. Do not invent or assume any detail that wasn't said.
If the input is already short and simple (one quick fact), just return it as one clean sentence instead of forcing bullet points.
Respond in ${langName}. Output ONLY the cleaned text — no preamble, no headers, no markdown besides the "- " bullet prefix.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",

async function splitIntoTasks(rawText){
  const langName = currentLang==='es' ? 'Spanish' : 'English';
  const systemPrompt = `You turn a rambling spoken or typed rundown for a construction crew into a list of separate, short, actionable tasks.
Split the input into individual tasks — one per distinct action, request, or thing to do. Keep each task short and clear.
Do not invent tasks that weren't mentioned. Do not merge unrelated tasks into one.
Respond in ${langName}.
Respond with ONLY a valid JSON array of strings, no markdown, no extra text. Example: ["Check the electrical panel","Pick up drywall screws","Meet the inspector at 10am"]`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 800,
        system: systemPrompt,
        messages: [{ role: "user", content: rawText }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b=>b.type==='text');
    let raw = textBlock ? textBlock.text : '';
    raw = raw.replace(/```json|```/g, '').trim();

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysFromToday(iso){
  const today = new Date(todayISO()+'T00:00:00');
  const target = new Date(iso+'T00:00:00');
  return Math.round((target-today)/86400000);
}

      date: property.auctionDate,
      time: property.auctionTime || null,

// ---------------- multi-day + recurring event logic ----------------
function jobOccursOnDate(job, iso){
  const start = job.date;
  const end = job.endDate || job.date;
  if(!job.recurrence || job.recurrence==='none' || job.type==='auction'){
    return iso >= start && iso <= end;
  }
  const startDate = new Date(start+'T00:00:00');
  const endDate = new Date(end+'T00:00:00');
  const spanDays = Math.round((endDate-startDate)/86400000);
  const targetDate = new Date(iso+'T00:00:00');
  if(targetDate < startDate) return false;
  if(job.recurrenceEndDate && iso > job.recurrenceEndDate) return false;
  const capYears = job.recurrence==='yearly' ? 15 : 1;
  const capDate = new Date(startDate); capDate.setFullYear(capDate.getFullYear()+capYears);
  if(targetDate > capDate) return false;

  if(job.recurrence==='weekly' || job.recurrence==='biweekly'){
    const stepDays = job.recurrence==='weekly' ? 7 : 14;
    const diffDays = Math.round((targetDate-startDate)/86400000);
    if(diffDays<0) return false;
    const mod = diffDays % stepDays;
    return mod>=0 && mod<=spanDays;
  }
  if(job.recurrence==='monthly'){
    const monthsDiff = (targetDate.getFullYear()-startDate.getFullYear())*12 + (targetDate.getMonth()-startDate.getMonth());
    if(monthsDiff<0) return false;
    const occStart = new Date(startDate);
    occStart.setMonth(occStart.getMonth()+monthsDiff);
    if(occStart.getDate() !== startDate.getDate()) return false;
    const occEnd = new Date(occStart); occEnd.setDate(occEnd.getDate()+spanDays);
    return targetDate >= occStart && targetDate <= occEnd;
  }
  if(job.recurrence==='yearly'){
    const yearsDiff = targetDate.getFullYear()-startDate.getFullYear();
    if(yearsDiff<0) return false;
    const occStart = new Date(startDate);
    occStart.setFullYear(occStart.getFullYear()+yearsDiff);
    if(occStart.getMonth()!==startDate.getMonth() || occStart.getDate()!==startDate.getDate()) return false;
    const occEnd = new Date(occStart); occEnd.setDate(occEnd.getDate()+spanDays);
    return targetDate >= occStart && targetDate <= occEnd;
  }
  return false;
}

function upcomingOccurrenceDelta(job){
  for(let d=0; d<=7; d++){
    const dt = new Date(); dt.setDate(dt.getDate()+d);
    const iso = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    if(jobOccursOnDate(job, iso)) return d;
  }
  return null;
}

function recurrenceLabel(job){
  if(!job.recurrence || job.recurrence==='none') return '';
  const map = {weekly:t('recur_weekly'), biweekly:t('recur_biweekly'), monthly:t('recur_monthly'), yearly:t('recur_yearly')};
  return map[job.recurrence] || '';
}

function parseCalSearchDate(q){
  q = q.trim().toLowerCase();
  const months = {jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
  let m = q.match(/^([a-z]+)\s+(\d{1,2})(?:\s*,?\s*(\d{4}))?$/);
  if(m && months[m[1]]!==undefined) return {y:m[3]?+m[3]:calYear, mo:months[m[1]], d:+m[2]};
  m = q.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{4}))?$/);
  if(m) return {y:m[3]?+m[3]:calYear, mo:+m[1]-1, d:+m[2]};
  m = q.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return {y:+m[1], mo:+m[2]-1, d:+m[3]};
  return null;
}

function runCalendarSearch(){
  calSearchJobIds = new Set();
  calSearchGcalIds = new Set();
  calSearchDay = null;
  const q = calSearch.trim().toLowerCase();
  let infoMsg = '';
  if(q){
    const dt = parseCalSearchDate(q);
    if(dt && dt.mo>=0 && dt.mo<12 && dt.d>=1 && dt.d<=31){
      calYear = dt.y; calMonth = dt.mo;
      calSearchDay = dt.y+'-'+String(dt.mo+1).padStart(2,'0')+'-'+String(dt.d).padStart(2,'0');
    } else {
      const hits = [];
      jobs.forEach(j=>{ if(j.title && j.title.toLowerCase().includes(q)) hits.push({kind:'job', id:j.id, date:j.date||j.startDate}); });
      googleEvents.forEach(g=>{ if(g.title && g.title.toLowerCase().includes(q)) hits.push({kind:'gcal', id:g.id, date:g.date}); });
      if(hits.length){
        hits.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
        const f = hits[0];
        if(f.date){ const parts = f.date.split('-'); calYear = +parts[0]; calMonth = +parts[1]-1; }
        hits.forEach(h=>{ (h.kind==='job'?calSearchJobIds:calSearchGcalIds).add(String(h.id)); });
        infoMsg = hits.length+' '+t('cal_search_found');
      } else {
        infoMsg = t('cal_search_none');
      }
    }
  }
  render();
  const info = document.getElementById('calSearchInfo');
  if(info) info.textContent = infoMsg;
  const si = document.getElementById('calSearch');
  if(si && q){ si.focus(); try{ si.setSelectionRange(si.value.length, si.value.length); }catch(e){} }
}

function renderCalendar(content){
  const monthNames = t('months');
  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

  // personalized reminders banner: auctions + jobs, filtered by this viewer's preferences
  const upcoming = jobs
    .map(j=>({...j, delta: upcomingOccurrenceDelta(j)}))
    .filter(j=>j.delta!==null)
    .filter(j=>{
      if(j.type==='auction') return notifPrefs.notifyAuctions;
      if(notifPrefs.notifyAllJobs) return true;
      if(notifPrefs.notifyMyJobs && notifPrefs.myName && j.crew && j.crew.includes(notifPrefs.myName)) return true;
      return false;
    })
    .sort((a,b)=>a.delta-b.delta);

  let bannerHtml = `<div class="banner"><div class="banner-title">${t('your_reminders')}</div>`;
  if(upcoming.length===0){
    bannerHtml += `<div class="banner-empty">${t('nothing_7days')}</div>`;
  }else{
    upcoming.forEach(u=>{
      const when = u.delta===0 ? t('today') : u.delta===1 ? t('tomorrow') : t('in_days').replace('{n}', u.delta);
      bannerHtml += `<div class="banner-item"><span class="when">${when}</span><span class="what">${escapeHtml(u.title)} — ${fmtDateShort(u.date)}${u.time ? ' '+t('sale_time')+' ' + fmtTime(u.time) : ''}</span></div>`;
    });
  }
  bannerHtml += '</div>';

  let html = `<div class="display" style="font-size:24px;">${t('tab_calendar')}</div>
  <div style="font-size:13.5px;color:#8a8175;margin-bottom:18px;max-width:520px;">${t('calendar_desc')}</div>`;
  html += bannerHtml;
  html += `<div class="cal-header">
    <div class="cal-nav">
      <button id="prevMonth">&#8249;</button>
      <div class="cal-month display">${monthNames[calMonth]} ${calYear}</div>
      <button id="nextMonth">&#8250;</button>
    </div>
    ${editMode ? `<button class="add-btn" id="addJobBtn">${t('add_to_calendar')}</button>` : ''}
    <button id="calZoomBtn" class="cal-zoom-btn">${calZoomedOut ? t('cal_zoom_in') : t('cal_zoom_out')}</button>
  </div>
  <div class="cal-search-row">
    <input id="calSearch" class="cal-search" placeholder="${t('cal_search_ph')}" value="${escapeAttr(calSearch)}" autocomplete="off">
    ${calSearch ? `<button id="calSearchClear" class="cal-search-clear">×</button>` : ''}
  </div>
  <div id="calSearchInfo" class="cal-search-info"></div>`;

  html += `<div class="cal-grid${calZoomedOut?' zoomed-out':''}">`;
  t('days').forEach(d=>{
    html += `<div class="cal-dow">${d}</div>`;
  });
  for(let i=0;i<startWeekday;i++){
    html += '<div class="cal-cell empty"></div>';
  }
  const today = todayISO();
  for(let day=1; day<=daysInMonth; day++){
    const iso = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const isToday = iso===today;
    const dayJobs = jobs.filter(j=>jobOccursOnDate(j, iso));
    const dayGoogle = googleEvents.filter(g=>g.date===iso);
    html += `<div class="cal-cell ${isToday?'today':''}${calSearchDay===iso?' match-day':''}" data-date="${iso}">
      <div class="cal-daynum">${day}</div>`;
    dayJobs.forEach(j=>{
      const recurIcon = (j.recurrence && j.recurrence!=='none') ? '🔁 ' : '';
      html += `<button class="chip ${j.type}${calSearchJobIds.has(String(j.id))?' chip-match':''}" data-jobid="${j.id}">${recurIcon}${j.time ? fmtTime(j.time)+' — ' : ''}${escapeHtml(j.title)}</button>`;
    });
    dayGoogle.forEach(g=>{
      html += `<button class="chip gcal${calSearchGcalIds.has(String(g.id))?' chip-match':''}" data-gcalid="${g.id}">📅 ${(g.time && g.time!=='00:00') ? fmtTime(g.time)+' — ' : ''}${escapeHtml(g.title)}</button>`;
    });
    if(editMode){
      html += `<button class="cal-add-day" data-date="${iso}">${t('add_entry')}</button>`;
    }
    html += `</div>`;
  }
  html += '</div>';

  content.innerHTML = html;

  document.getElementById('prevMonth').onclick = ()=>{
    calMonth--; if(calMonth<0){calMonth=11;calYear--;}
    render();
  };
  document.getElementById('nextMonth').onclick = ()=>{
    calMonth++; if(calMonth>11){calMonth=0;calYear++;}
    render();
  };
  const addBtn = document.getElementById('addJobBtn');
  if(addBtn) addBtn.onclick = ()=>openJobModal(null, todayISO());

  const calZoomBtn = document.getElementById('calZoomBtn');
  if(calZoomBtn) calZoomBtn.onclick = ()=>{ calZoomedOut = !calZoomedOut; render(); };

  const calSearchInput = document.getElementById('calSearch');
  if(calSearchInput){
    calSearchInput.addEventListener('input', ()=>{
      calSearch = calSearchInput.value;
      clearTimeout(calSearchTimer);
      calSearchTimer = setTimeout(runCalendarSearch, 350);
    });
    const calSearchClear = document.getElementById('calSearchClear');
    if(calSearchClear) calSearchClear.onclick = ()=>{ calSearch=''; clearTimeout(calSearchTimer); runCalendarSearch(); };
  }

  content.querySelectorAll('.cal-add-day').forEach(b=>{
    b.onclick = ()=>openJobModal(null, b.dataset.date);
  });
  content.querySelectorAll('.chip:not(.gcal)').forEach(b=>{
    b.onclick = ()=>{
      const job = jobs.find(j=>j.id===b.dataset.jobid);
      if(job) openJobModal(job);
    };
  });
  content.querySelectorAll('.chip.gcal').forEach(b=>{
    b.onclick = ()=>{
      const ev = googleEvents.find(g=>g.id===b.dataset.gcalid);
      if(ev) openGoogleEventModal(ev);
    };
  });
}

    <div class="modal modal-wrap">
      <button class="modal-close" id="closeM">&times;</button>
      <h3>📅 ${escapeHtml(ev.title)}</h3>

// ---------------- job modal ----------------
function openJobModal(job, prefillDate){
  const isEdit = !!job;
  const isAuction = job && job.type==='auction';
  const root = document.getElementById('modalRoot');

  if(!editMode){
    // read-only detail view
    const dateRangeText = (job.endDate && job.endDate !== job.date)
      ? fmtDate(job.date) + ' – ' + fmtDate(job.endDate)
      : fmtDate(job.date) + (job.time ? ' '+t('sale_time')+' ' + fmtTime(job.time) : '');
    root.innerHTML = `<div class="overlay" id="ov">
      <div class="modal modal-wrap">
        <button class="modal-close" id="closeM">&times;</button>
        <h3>${escapeHtml(job.title)}</h3>
        <div class="detail-row"><strong>${t('field_date')}:</strong> ${dateRangeText}</div>
        ${job.recurrence && job.recurrence!=='none' ? `<div class="detail-row" style="color:#8a8175;">🔁 ${recurrenceLabel(job)}</div>` : ''}
        ${job.address ? `<div class="detail-row"><strong>${t('field_address')}:</strong> ${escapeHtml(job.address)}</div>` : ''}
        ${job.customer ? `<div class="detail-row"><strong>${t('field_customer').split(' (')[0]}:</strong> ${escapeHtml(job.customer)}</div>` : ''}
        ${job.crew && job.crew.length ? `<div class="detail-row"><strong>${t('crew_label')}</strong> ${job.crew.map(escapeHtml).join(', ')}</div>` : ''}
        ${job.notes ? `<div class="detail-row"><strong>${t('field_notes')}:</strong> ${escapeHtml(job.notes)}</div>` : ''}
        <div class="modal-actions"><button class="btn-secondary" id="icsBtn" style="flex:1;">${t('add_to_my_calendar')}</button></div>
        <div class="quickfill-hint" style="margin-top:8px;">${t('ics_hint')}</div>
      </div>
    </div>`;
    document.getElementById('closeM').onclick = closeModal;
    document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };
    document.getElementById('icsBtn').onclick = ()=>downloadIcs(job);
    return;
  }

  let pickedCrew = job ? [...(job.crew||[])] : [];

  root.innerHTML = `<div class="overlay" id="ov">
    <div class="modal modal-wrap">
      <button class="modal-close" id="closeM">&times;</button>
      <h3>${isEdit ? t('modal_edit_entry') : t('modal_add_entry')}</h3>
      ${isAuction ? `<div style="font-size:12.5px;color:#8a8175;margin-bottom:12px;">${t('linked_to_property')}</div>` : ''}
      ${isEdit && job.recurrence && job.recurrence!=='none' ? `<div style="font-size:12.5px;color:var(--brick);margin-bottom:12px;">🔁 ${t('recurring_series_hint')}</div>` : ''}
      <div class="field">
        <label>${t('field_title')}</label>
        <input id="fTitle" value="${job ? escapeAttr(job.title) : ''}" placeholder="e.g. Demo day — 4th St" ${isAuction?'disabled':''}>
      </div>
      <div class="field-row">
        <div class="field">
          <label>${t('field_date')}</label>
          <input id="fDate" type="date" value="${job ? job.date : (prefillDate||todayISO())}" ${isAuction?'disabled':''}>
        </div>
        <div class="field">
          <label>${t('field_end_date')}</label>
          <input id="fEndDate" type="date" value="${job && job.endDate ? job.endDate : ''}" ${isAuction?'disabled':''}>
        </div>
      </div>
      <div class="field">
        <label>${t('field_address_optional')}</label>
        <input id="fAddress" value="${job && job.address ? escapeAttr(job.address) : ''}" placeholder="Job site address" ${isAuction?'disabled':''}>
      </div>
      <div class="field">
        <label>${t('field_customer')}</label>
        <input id="fCustomer" value="${job && job.customer ? escapeAttr(job.customer) : ''}" placeholder="${t('field_customer_ph')}" ${isAuction?'disabled':''}>
      </div>
      <div class="field">
        <label>${t('field_repeat')}</label>
        <select id="fRepeat" ${isAuction?'disabled':''}>
          <option value="none" ${(!job || !job.recurrence || job.recurrence==='none')?'selected':''}>${t('repeat_none')}</option>
          <option value="weekly" ${job && job.recurrence==='weekly'?'selected':''}>${t('recur_weekly')}</option>
          <option value="biweekly" ${job && job.recurrence==='biweekly'?'selected':''}>${t('recur_biweekly')}</option>
          <option value="monthly" ${job && job.recurrence==='monthly'?'selected':''}>${t('recur_monthly')}</option>
          <option value="yearly" ${job && job.recurrence==='yearly'?'selected':''}>${t('recur_yearly')}</option>
        </select>
      </div>
      <div class="field" id="fRepeatUntilWrap" style="display:${job && job.recurrence && job.recurrence!=='none' ? 'block':'none'};">
        <label>${t('field_repeat_until')}</label>
        <input id="fRepeatUntil" type="date" value="${job && job.recurrenceEndDate ? job.recurrenceEndDate : ''}">
        <div class="photo-url-hint">${t('repeat_until_hint')}</div>
      </div>
      <div class="field">
        <label>${t('field_crew')}</label>
        <div class="crew-pick" id="crewPick"></div>
      </div>
      <div class="field">
        <label>${t('field_notes')}</label>
        <textarea id="fNotes" placeholder="Anything the crew should know">${job && job.notes ? escapeHtml(job.notes) : ''}</textarea>
      </div>
      <div class="modal-actions">
        ${isEdit && !isAuction ? `<button class="btn-danger" id="delBtn">${t('delete')}</button>` : ''}
        <button class="btn-secondary" id="cancelBtn">${t('cancel')}</button>
        ${!isAuction ? `<button class="btn-primary" id="saveBtn">${t('save')}</button>` : ''}
      </div>
      ${isEdit ? `<div class="modal-actions" style="margin-top:8px;"><button class="btn-secondary" id="icsBtn" style="flex:1;">${t('add_to_my_calendar')}</button></div>` : ''}
    </div>
  </div>`;

  const repeatSelect = document.getElementById('fRepeat');
  if(repeatSelect){
    repeatSelect.onchange = ()=>{
      document.getElementById('fRepeatUntilWrap').style.display = repeatSelect.value==='none' ? 'none' : 'block';
    };
  }

  const crewPickEl = document.getElementById('crewPick');
  function renderCrewPicker(){
    crewPickEl.innerHTML = CREW_DEFAULTS.map(name=>{
      const picked = pickedCrew.includes(name);
      return `<button type="button" class="crew-tag ${picked?'picked':''}" data-name="${name}">${name}</button>`;
    }).join('');
    crewPickEl.querySelectorAll('.crew-tag').forEach(b=>{
      b.onclick = ()=>{
        const n = b.dataset.name;
        if(pickedCrew.includes(n)) pickedCrew = pickedCrew.filter(x=>x!==n);
        else pickedCrew.push(n);
        renderCrewPicker();
      };
    });
  }
  renderCrewPicker();

  document.getElementById('closeM').onclick = closeModal;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };
  const icsBtn = document.getElementById('icsBtn');
  if(icsBtn) icsBtn.onclick = ()=>downloadIcs(job);

  const delBtn = document.getElementById('delBtn');
  if(delBtn){
    delBtn.onclick = ()=>{
      showConfirm(t('delete_entry_confirm'), async ()=>{
        jobs = jobs.filter(j=>j.id!==job.id);
        await saveJobs();
        closeModal();
        render();
      });
    };
  }

  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      const title = document.getElementById('fTitle').value.trim();
      const date = document.getElementById('fDate').value;
      if(!title || !date){ showAlert(t('title_date_required')); return; }
      let endDate = document.getElementById('fEndDate').value || null;
      if(endDate && endDate < date) endDate = null; // ignore an end date before the start date
      const recurrence = document.getElementById('fRepeat').value;
      const recurrenceEndDate = recurrence!=='none' ? (document.getElementById('fRepeatUntil').value || null) : null;
      const entry = {
        id: job ? job.id : uid(),
        type:'job',
        title,
        date,
        endDate,
        recurrence: recurrence==='none' ? null : recurrence,
        recurrenceEndDate,
        address: document.getElementById('fAddress').value.trim(),
        customer: document.getElementById('fCustomer').value.trim(),
        crew: pickedCrew,
        notes: document.getElementById('fNotes').value.trim(),
        propertyId: null
      };
      if(isEdit){
        const idx = jobs.findIndex(j=>j.id===job.id);
        jobs[idx] = entry;
      }else{
        jobs.push(entry);
      }
      await saveJobs();
      closeModal();
      render();
    };
  }
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

// ---------------- properties view ----------------
function statusLabel(status){
  const map = {'Watching':'watching','Bid Submitted':'bid_submitted','Won':'won','Active':'active_status','Passed':'passed','All':'all'};
  return t(map[status] || 'watching');
}

function isNewProp(p){
  return p.createdAt && (Date.now() - Number(p.createdAt)) < 7*24*60*60*1000;
}

function fitBadge(p){
  const s = (p.fitScore===undefined || p.fitScore===null || p.fitScore==='') ? null : Number(p.fitScore);
  if(s===null || isNaN(s)) return '';
  const cls = s>=80 ? 'high' : s>=50 ? 'mid' : '';
  return `<span class="prop-fit ${cls}">${t('fit_label')} ${s}</span>`;
}

function specsLine(p){
  const parts = [];
  if(p.beds) parts.push(`${escapeHtml(String(p.beds))} ${t('spec_beds_short')}`);
  if(p.baths) parts.push(`${escapeHtml(String(p.baths))} ${t('spec_baths_short')}`);
  if(p.sqft) parts.push(`${escapeHtml(String(p.sqft))} ${t('spec_sqft_short')}`);
  if(p.lotSize) parts.push(`${t('field_lot_size')}: ${escapeHtml(String(p.lotSize))}`);
  return parts.length ? `<div class="prop-specs">${parts.join(' &nbsp;|&nbsp; ')}</div>` : '';
}

function propCardHtml(p){
  const statusClass = 'status-' + (p.status||'Watching').toLowerCase().replace(' ','-').replace('bid-submitted','bid');
  let auctionLine = '';
  if(p.auctionDate){
    const delta = daysFromToday(p.auctionDate);
    let label = fmtDateShort(p.auctionDate) + (p.auctionTime ? ' '+t('sale_time')+' ' + fmtTime(p.auctionTime) : '');
    if(delta>=0 && delta<=7) label += delta===0 ? ' — '+t('today').toLowerCase()+'!' : delta===1 ? ' — '+t('tomorrow').toLowerCase() : ' — '+t('in_days').replace('{n}', delta).toLowerCase();
    auctionLine = `<div class="prop-auction">${t('auction_label')} ${label}</div>`;
  }
  const lastNote = (p.noteLog && p.noteLog.length) ? p.noteLog[p.noteLog.length-1] : null;
  const dealBits = [p.propertyType, p.dealType, p.source].filter(Boolean).map(escapeHtml).join(' • ');
  const countyBits = [p.county ? escapeHtml(p.county) : '', dealBits].filter(Boolean).join(' • ');
  return `<div class="prop-card listing ${editMode?'editable':''}" data-id="${p.id}">
    <div class="prop-photo">${p.photoUrl ? `<img src="${escapeAttr(p.photoUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=&quot;no-photo&quot;>${t('no_photo')}</span>'">` : `<span class="no-photo">${t('no_photo')}</span>`}${fitBadge(p)}${isNewProp(p) ? `<span class="prop-new">${t('new_badge')}</span>` : ''}</div>
    <div class="prop-card-body">
      ${p.price ? `<div class="prop-price-big">${escapeHtml(p.price)}</div>` : ''}
      ${specsLine(p)}
      <div class="prop-address">${escapeHtml(p.address||'(no address)')}</div>
      ${countyBits ? `<div class="prop-meta">${countyBits}</div>` : ''}
      <div class="prop-badges"><span class="status-badge ${statusClass}">${escapeHtml(statusLabel(p.status||'Watching'))}</span></div>
      ${auctionLine}
      <div class="card-actions">
        ${p.driveUrl ? `<a class="drive-link-btn" href="${escapeAttr(p.driveUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('drive_folder_btn')}</a>` : ''}
        ${p.listingUrl ? `<a class="listing-link-btn" href="${escapeAttr(p.listingUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('view_listing_btn')}</a>` : ''}
        ${p.address ? `<a class="directions-btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.address)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('directions_btn')}</a>` : ''}
      </div>
      ${lastNote ? `<div class="prop-notes">${t('latest_note')} ${escapeHtml(lastNote.text)}</div>` : ''}
    </div>
  </div>`;
}

function renderProperties(content){
  const statuses = ['All','Watching','Bid Submitted','Won','Active','Passed'];

  let html = `<div class="display" style="font-size:24px;">${t('tab_properties')}</div>
  <div style="font-size:13.5px;color:#8a8175;margin-bottom:18px;max-width:520px;">${t('properties_desc')}</div>`;
  html += '<div class="filter-row">';
  statuses.forEach(s=>{
    html += `<button class="filter-chip ${propFilter===s?'active':''}" data-status="${s}">${statusLabel(s)}</button>`;
  });
  html += `<input class="filter-search" id="searchBox" placeholder="${t('search_placeholder')}" value="${escapeAttr(propSearch)}">`;
  if(editMode){
    html += `<button class="add-btn" id="addPropBtn">${t('add_property_btn')}</button>`;
  }
  html += '</div>';

  let list = properties.filter(p=>{
    const matchesStatus = propFilter==='All' || p.status===propFilter;
    const q = propSearch.toLowerCase();
    const matchesSearch = !q || (p.address||'').toLowerCase().includes(q) || (p.county||'').toLowerCase().includes(q);
    return matchesStatus && matchesSearch;
  }).sort((a,b)=> ((b.fitScore===undefined||b.fitScore==='' ? -1 : Number(b.fitScore)) - (a.fitScore===undefined||a.fitScore==='' ? -1 : Number(a.fitScore))) || ((b.createdAt||0)-(a.createdAt||0)));

  if(list.length===0){
    html += `<div class="empty-state"><div class="display">${t('no_properties_title')}</div><div>${editMode ? t('no_properties_edit') : t('no_properties_view')}</div></div>`;
  }else{
    html += '<div class="prop-grid">';
    list.forEach(p=>{ html += propCardHtml(p); });
    html += '</div>';
  }

  content.innerHTML = html;

  content.querySelectorAll('.filter-chip').forEach(b=>{
    b.onclick = ()=>{ propFilter = b.dataset.status; render(); };
  });
  document.getElementById('searchBox').oninput = (e)=>{ propSearch = e.target.value; render(); };
  const addPropBtn = document.getElementById('addPropBtn');
  if(addPropBtn) addPropBtn.onclick = ()=>openPropertyModal(null);

  if(editMode){
    content.querySelectorAll('.prop-card').forEach(c=>{
      c.onclick = ()=>{
        const p = properties.find(x=>x.id===c.dataset.id);
        if(p) openPropertyModal(p);
      };
    });
  }
}

// ---------------- active jobs view ----------------
function jobPhaseInfo(job){
  const phase = job.phase || 'In Progress';
  if(phase==='Bid Phase') return {label:t('phase_bid'), cls:'status-bid'};
  if(phase==='Complete') return {label:t('phase_complete'), cls:'status-won'};
  return {label:t('phase_progress'), cls:'status-active'};
}
function activeJobCardHtml(job){
  const lastNote = (job.noteLog && job.noteLog.length) ? job.noteLog[job.noteLog.length-1] : null;
  const pi = jobPhaseInfo(job);
  const jt = job.jobType || 'Renovation';
  const jtCls = jt==='Flip' ? 'status-flip' : 'status-reno';
  const jtLabel = t(jt==='Flip' ? 'job_type_flip' : 'job_type_reno');
  const badges = `<span class="status-badge ${pi.cls}">${escapeHtml(pi.label)}</span><span class="status-badge ${jtCls}" style="margin-left:6px;">${escapeHtml(jtLabel)}</span>`;
  const crewLine = job.crew && job.crew.length ? `<div class="prop-meta">${t('crew_label')} ${job.crew.map(escapeHtml).join(', ')}</div>` : '';
  const driveBtn = job.driveUrl ? `<a class="drive-link-btn" href="${escapeAttr(job.driveUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('drive_folder_btn')}</a>` : '';
  const dirBtn = job.title ? `<a class="directions-btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(job.title)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t('directions_btn')}</a>` : '';
  const noteLine = lastNote ? `<div class="prop-notes">${t('latest_note')} ${escapeHtml(lastNote.text)}</div>` : '';
  if(jt==='Flip'){
    return `<div class="prop-card listing ${editMode?'editable':''}" data-source="standalone" data-id="${job.id}">
    <div class="prop-photo">${job.photoUrl ? `<img src="${escapeAttr(job.photoUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=&quot;no-photo&quot;>${t('no_photo')}</span>'">` : `<span class="no-photo">${t('no_photo')}</span>`}</div>
    <div class="prop-card-body">
      <div class="prop-address">${escapeHtml(job.title||'(untitled job)')}</div>
      ${crewLine}
      <div class="prop-badges">${badges}</div>
      ${(driveBtn || dirBtn) ? `<div class="card-actions">${driveBtn}${dirBtn}</div>` : ''}
      ${noteLine}
    </div>
  </div>`;
  }
  return `<div class="prop-card ${editMode?'editable':''}" data-source="standalone" data-id="${job.id}">
    <div class="prop-address">${escapeHtml(job.title||'(untitled job)')}</div>
    ${badges}
    ${crewLine}
    ${(driveBtn || dirBtn) ? `<div class="card-actions">${driveBtn}${dirBtn}</div>` : ''}
    ${noteLine}
  </div>`;
}

async function moveJobToHof(job){
  const entry = {
    id: uid(),
    address: job.title || '',
    coverPhoto: job.photoUrl || '',
    driveUrl: job.driveUrl || '',
    jobType: job.jobType || 'Renovation',
    purchasePrice: '', renoCost: '', sellPrice: '',
    soldDate: todayISO(),
    beforePhotos: [], afterPhotos: [],
    story: (job.noteLog||[]).map(n=>`${n.date? n.date+': ' : ''}${n.text||''}`.trim()).join('\n'),
    createdAt: Date.now()
  };
  flips.push(entry);
  activeJobs = activeJobs.filter(j=>String(j.id)!==String(job.id));
  await saveFlips();
  await saveActiveJobs();
}

function reopenFlip(id){
  const f = flips.find(x=>String(x.id)===String(id));
  if(!f) return;
  showConfirm(t('reopen_flip_confirm'), async ()=>{
    activeJobs.push({
      id: uid(),
      title: f.address || '',
      phase: 'In Progress',
      jobType: f.jobType || 'Flip',
      photoUrl: f.coverPhoto || null,
      driveUrl: f.driveUrl || null,
      crew: [],
      noteLog: f.story ? [{id: uid(), text: f.story, date: todayISO()}] : [],
      createdAt: Date.now()
    });
    flips = flips.filter(x=>String(x.id)!==String(id));
    await saveActiveJobs();
    await saveFlips();
    closeModal();
    render();
  });
}

function renderActiveJobs(content){
  const activeProps = properties.filter(p=>p.status==='Active').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const phaseOrder = {'Bid Phase':0, 'In Progress':1, 'Complete':2};
  const phaseRank = j => (phaseOrder[j.phase||'In Progress']!==undefined ? phaseOrder[j.phase||'In Progress'] : 1);
  const standalone = [...activeJobs].sort((a,b)=> (phaseRank(a)-phaseRank(b)) || ((b.createdAt||0)-(a.createdAt||0)));

  let html = `<div class="display" style="font-size:24px;">${t('tab_active')}</div>
  <div style="font-size:13.5px;color:#8a8175;margin-bottom:18px;max-width:520px;">${t('active_desc')}</div>`;
  html += `<div class="filter-row" style="margin-bottom:14px;"><input class="filter-search" id="ajSearchBox" placeholder="${t('aj_search_ph')}" style="margin-left:0;flex:1;max-width:340px;"></div>`;
  if(editMode){
    html += `<div class="cal-header" style="margin-bottom:18px;">
      <div></div>
      <button class="add-btn" id="addActiveJobBtn">${t('add_active_job_btn')}</button>
    </div>`;
  }

  if(activeProps.length===0 && standalone.length===0){
    html += `<div class="empty-state"><div class="display">${t('no_active_title')}</div><div>${editMode ? t('no_active_edit') : t('no_active_view')}</div></div>`;
  }else{
    html += '<div class="prop-grid">';
    activeProps.forEach(p=>{ html += propCardHtml(p); });
    standalone.forEach(j=>{ html += activeJobCardHtml(j); });
    html += '</div>';
  }

  content.innerHTML = html;

  const addBtn = document.getElementById('addActiveJobBtn');
  if(addBtn) addBtn.onclick = ()=>openActiveJobModal(null);

  const ajSearchBox = document.getElementById('ajSearchBox');
  if(ajSearchBox){
    ajSearchBox.oninput = ()=>{
      const q = ajSearchBox.value.trim().toLowerCase();
      content.querySelectorAll('.prop-grid .prop-card').forEach(c=>{
        c.style.display = (!q || c.textContent.toLowerCase().includes(q)) ? '' : 'none';
      });
    };
  }

  if(editMode){
    content.querySelectorAll('.prop-card').forEach(c=>{
      c.onclick = ()=>{
        if(c.dataset.source==='standalone'){
          const j = activeJobs.find(x=>x.id===c.dataset.id);
          if(j) openActiveJobModal(j);
        }else{
          const p = properties.find(x=>x.id===c.dataset.id);
          if(p) openPropertyModal(p);
        }
      };
    });
  }
}

  // ---- quick-fill from pasted listing text ----
  const qfBtn = document.getElementById('qfBtn');
  if(qfBtn){
    qfBtn.onclick = ()=>{
      const raw = document.getElementById('qfPaste').value;
      if(!raw.trim()){ showAlert(t('quickfill_need_text')); return; }
      let foundBits = [];
      // price: first $ amount found
      const priceMatch = raw.match(/\$\s?[\d,]+(?:\.\d{2})?/);
      if(priceMatch) document.getElementById('pPrice').value = priceMatch[0].replace(/\s+/,'');
      // address: line containing a street-number pattern
      const lines = raw.split(/\n|\r/).map(l=>l.trim()).filter(Boolean);
      const addrLine = lines.find(l=>/^\d{2,6}\s+\S+/.test(l));
      if(addrLine) document.getElementById('pAddress').value = addrLine;
      // county: look for "County" keyword
      const countyMatch = raw.match(/([A-Z][a-zA-Z]+)\s+County/);
      if(countyMatch) document.getElementById('pCounty').value = countyMatch[1] + ' County';
      // source: guess from domain-ish keywords in the text
      const lower = raw.toLowerCase();
      const sourceSelect = document.getElementById('pSource');
      if(lower.includes('auction.com')) sourceSelect.value = 'Auction.com';
      else if(lower.includes('xome')) sourceSelect.value = 'Xome';
      else if(lower.includes('hubzu')) sourceSelect.value = 'Hubzu';
      // auction/sale time: e.g. "10:00 AM", "2 PM", "at 9:30am"
      const timeMatch = raw.match(/(\d{1,2})(?::(\d{2}))?\s?(am|pm|AM|PM)\b/);
      if(timeMatch){
        let hr = parseInt(timeMatch[1],10);
        const min = timeMatch[2] ? timeMatch[2] : '00';

        if(mer==='pm' && hr!==12) hr += 12;
        if(mer==='am' && hr===12) hr = 0;

        foundBits.push('Sale time: ' + timeMatch[0].trim());
      }
      // square footage: number followed by sq ft / sqft / square feet
      const sqftMatch = raw.match(/([\d,]{3,6})\s*(?:sq\.?\s?ft\.?|sqft|square\s?feet)/i);
      if(sqftMatch){ document.getElementById('pSqft').value = sqftMatch[1]; foundBits.push('Sq ft: ' + sqftMatch[1]); }
      // beds / baths, since they're usually right next to sqft on listing pages
      const bedsMatch = raw.match(/(\d+(?:\.\d+)?)\s*(?:bed|beds|bd|bedrooms?)\b/i);
      if(bedsMatch){ document.getElementById('pBeds').value = bedsMatch[1]; foundBits.push('Beds: ' + bedsMatch[1]); }
      const bathsMatch = raw.match(/(\d+(?:\.\d+)?)\s*(?:bath|baths|ba|bathrooms?)\b/i);
      if(bathsMatch){ document.getElementById('pBaths').value = bathsMatch[1]; foundBits.push('Baths: ' + bathsMatch[1]); }
      // lot size: acres or sq ft lot
      const lotAcreMatch = raw.match(/([\d.]+)\s*acres?\b/i);
      const lotSqftMatch = raw.match(/lot\s*(?:size)?\s*[:\-]?\s*([\d,]{3,7})\s*(?:sq\.?\s?ft\.?|sqft)/i);
      if(lotAcreMatch){ document.getElementById('pLotSize').value = lotAcreMatch[1] + ' acres'; foundBits.push('Lot size: ' + lotAcreMatch[1] + ' acres'); }
      else if(lotSqftMatch){ document.getElementById('pLotSize').value = lotSqftMatch[1] + ' sq ft'; foundBits.push('Lot size: ' + lotSqftMatch[1] + ' sq ft'); }
      // year built
      const yearMatch = raw.match(/built\s*(?:in)?\s*[:\-]?\s*(19|20)\d{2}/i);
      if(yearMatch) foundBits.push('Year built: ' + yearMatch[0].match(/(19|20)\d{2}/)[0]);

      if(foundBits.length){
        noteLog.push({id:uid(), text:'From listing — ' + foundBits.join(' · '), date:todayISO()});
        renderNoteLog();
      }
      showAlert(t('quickfill_success'));
    };
  }

  const delBtn = document.getElementById('delBtn');
  if(delBtn){
    delBtn.onclick = ()=>{
      showConfirm(t('delete_property_confirm'), async ()=>{
        await removePropertyAuction(property.id);
        properties = properties.filter(p=>p.id!==property.id);
        await saveProperties();
        closeModal();
        render();
      });
    };
  }

  document.getElementById('saveBtn').onclick = async ()=>{
    const address = document.getElementById('pAddress').value.trim();
    if(!address){ showAlert(t('address_required')); return; }
    const entry = {
      id: property ? property.id : uid(),
      address,
      county: document.getElementById('pCounty').value.trim(),
      source: document.getElementById('pSource').value,
      price: document.getElementById('pPrice').value.trim(),
      status: document.getElementById('pStatus').value,
      beds: document.getElementById('pBeds').value.trim(),
      baths: document.getElementById('pBaths').value.trim(),
      sqft: document.getElementById('pSqft').value.trim(),
      lotSize: document.getElementById('pLotSize').value.trim(),
      propertyType: document.getElementById('pPropType').value,
      dealType: document.getElementById('pDealType').value,
      fitScore: document.getElementById('pFitScore').value.trim()==='' ? '' : Math.max(0, Math.min(100, Number(document.getElementById('pFitScore').value))),
      photoUrl: document.getElementById('pPhotoUrl').value.trim() || null,
      listingUrl: document.getElementById('pListingUrl').value.trim() || null,
      auctionDate: document.getElementById('pAuctionDate').value || null,
      auctionTime: document.getElementById('pAuctionTime').value || null,
      driveUrl: document.getElementById('pDriveUrl').value.trim() || null,
      noteLog: noteLog,
      createdAt: property ? property.createdAt : Date.now()
    };
    if(property){
      const idx = properties.findIndex(p=>p.id===property.id);
      properties[idx] = entry;
    }else{
      properties.push(entry);
    }
    await saveProperties();
    await syncPropertyAuction(entry);
    closeModal();
    render();
  };
}

function renderDailyToDo(content){

    render();
  };
  document.getElementById('dtdNextDay').onclick = ()=>{
    const d = new Date(dtdSelectedDate + 'T00:00:00');
    d.setDate(d.getDate()+1);
    dtdSelectedDate = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    render();
  };
  document.getElementById('dtdTodayBtn').onclick = ()=>{
    dtdSelectedDate = todayISO();

  };

function renderCrewTaskList(){
  const listEl = document.getElementById('dtdTaskList');
  if(!listEl) return;
  const tasks = dailyTasks.filter(tk=>tk.dateISO===dtdSelectedDate && tk.crewName===listEl.dataset.crew);
  if(tasks.length===0){
    listEl.innerHTML = `<div class="note-empty">${editMode ? t('dtd_no_tasks_edit') : t('dtd_no_tasks_view')}</div>`;
    return;
  }
  listEl.innerHTML = tasks.map(tk=>`
    <div class="note-entry-row" style="padding:6px 0;" data-id="${tk.id}">
      <button type="button" class="note-checkbox ${tk.done?'checked':''}" data-id="${tk.id}">✓</button>
      <div class="note-entry-body">
        <div class="note-text" style="${tk.done?'text-decoration:line-through;color:#a89e91;':''}">${escapeHtml(tk.text)}</div>
      </div>
      ${editMode ? `<button type="button" class="modal-close" style="position:static;width:auto;height:auto;font-size:16px;" data-del="${tk.id}">&times;</button>` : ''}
    </div>
  `).join('');

  listEl.querySelectorAll('.note-checkbox').forEach(cb=>{
    cb.onclick = async ()=>{
      const id = cb.dataset.id;
      const task = dailyTasks.find(tk=>tk.id===id);
      if(!task) return;
      const wasDone = task.done;
      task.done = !task.done;
      await saveDailyTasks();
      renderCrewTaskList();
      renderDailyTodoCardsInBackground();
      if(!wasDone && task.done){
        showUndoToast(t('dtd_task_completed'), async ()=>{
          task.done = false;
          await saveDailyTasks();
          renderCrewTaskList();
          renderDailyTodoCardsInBackground();
        });
      }
    };
  });

  if(editMode){
    listEl.querySelectorAll('button[data-del]').forEach(b=>{
      b.onclick = ()=>{
        showConfirm(t('delete_entry_confirm'), async ()=>{
          dailyTasks = dailyTasks.filter(tk=>tk.id!==b.dataset.del);
          await saveDailyTasks();
          renderCrewTaskList();
          renderDailyTodoCardsInBackground();
        });
      };
    });
  }
}

function renderDailyTodoCardsInBackground(){
  // refresh the crew summary cards behind the modal without closing it
  if(activeTab==='dailytodo'){
    const dateObj = new Date(dtdSelectedDate + 'T00:00:00');
    const cards = document.querySelectorAll('#content .prop-card[data-name]');
    cards.forEach(c=>{

      const doneCount = tasks.filter(tk=>tk.done).length;
      const badge = tasks.length===0 ? t('dtd_no_tasks_badge') : t('dtd_tasks_count').replace('{done}', doneCount).replace('{total}', tasks.length);

      if(metaEl) metaEl.textContent = badge;
    });
  }
}

function openCrewDayModal(crewName){
  const root = document.getElementById('modalRoot');
  const dateObj = new Date(dtdSelectedDate + 'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString(currentLang==='es' ? 'es-ES' : 'en-US', {weekday:'long', month:'short', day:'numeric'});

  root.innerHTML = `<div class="overlay" id="ov">
    <div class="modal modal-wrap">

      <h3>${escapeHtml(crewName)}</h3>
      <div style="font-size:12.5px;color:#8a8175;margin-bottom:14px;text-transform:capitalize;">${dateLabel}</div>
      <div class="notelog" id="dtdTaskList" data-crew="${escapeAttr(crewName)}" style="max-height:none;margin-bottom:${editMode?'16px':'0'};"></div>
      ${editMode ? `
      <div class="note-add-row" style="align-items:flex-start;margin-bottom:10px;">
        <textarea id="dtdNewTasks" placeholder="${t('dtd_add_placeholder')}" style="min-height:70px;"></textarea>
        <button type="button" class="mic-btn" id="dtdMicBtn">🎤</button>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="dtdClearBtn">${t('dtd_clear_completed')}</button>
        <button class="btn-primary" id="dtdSplitBtn" style="flex:1;">${t('dtd_add_as_tasks')}</button>
      </div>` : ''}
    </div>
  </div>`;

  document.getElementById('closeM').onclick = closeModal;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') closeModal(); };

  renderCrewTaskList();

  if(editMode){
    attachVoiceButton('dtdNewTasks', 'dtdMicBtn');

    document.getElementById('dtdSplitBtn').onclick = async ()=>{
      const ta = document.getElementById('dtdNewTasks');
      const raw = ta.value.trim();
      if(!raw) return;
      const splitBtn = document.getElementById('dtdSplitBtn');
      splitBtn.disabled = true;
      const originalText = splitBtn.textContent;
      splitBtn.textContent = t('dtd_splitting');

      let items = await splitIntoTasks(raw);
      if(!items || items.length===0){
        // fallback: naive split on newlines
        items = raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      }
      if(items.length===0){
        showAlert(t('dtd_split_error'));
      }else{
        items.forEach(text=>{
          dailyTasks.push({
            id: uid(),
            dateISO: dtdSelectedDate,
            crewName: crewName,
            text,
            done: false,
            createdAt: Date.now()
          });
        });
        await saveDailyTasks();
        ta.value = '';
        renderCrewTaskList();
        renderDailyTodoCardsInBackground();
      }
      splitBtn.disabled = false;
      splitBtn.textContent = originalText;
    };

    document.getElementById('dtdClearBtn').onclick = ()=>{
      showConfirm(t('dtd_clear_confirm'), async ()=>{
        dailyTasks = dailyTasks.filter(tk=>!(tk.dateISO===dtdSelectedDate && tk.crewName===crewName && tk.done));
        await saveDailyTasks();
        renderCrewTaskList();
        renderDailyTodoCardsInBackground();
      });
    };
  }
}

// ---------------- open notes ----------------
function renderOpenNotes(content){
  // build the list of currently "active" jobs to link notes to
  const activeJobOptions = [];
  properties.filter(p=>p.status==='Active').forEach(p=>{
    activeJobOptions.push({id:p.id, label:p.address});
  });
  activeJobs.forEach(j=>{
    activeJobOptions.push({id:j.id, label:j.title});
  });

  let html = `<div class="cal-header" style="margin-bottom:6px;">
    <div class="display" style="font-size:24px;">${t('tab_opennotes')}</div>
  </div>
  <div style="font-size:13.5px;color:#8a8175;margin-bottom:18px;max-width:520px;">${t('opennotes_desc')}</div>`;

  html += `<div class="field" style="max-width:340px;">
      <label>${t('opennotes_link_job')}</label>
      <select id="onJobSelect">
        <option value="">${t('opennotes_no_job')}</option>
        ${activeJobOptions.map(j=>`<option value="${j.id}">${escapeHtml(j.label)}</option>`).join('')}
      </select>
    </div>
    <div class="note-add-row" style="margin-bottom:10px;align-items:flex-start;">
      <textarea id="onNewNote" placeholder="${t('opennotes_placeholder')}" style="min-height:80px;"></textarea>
